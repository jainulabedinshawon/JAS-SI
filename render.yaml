services:
  - type: pserv
    name: jas-si-staging-github-capability-broker
    runtime: docker
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m jas_si_agent.github_capability_server
    autoDeploy: false
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: jas-si-staging-agent-shared
      - key: JAS_SI_ENVIRONMENT
        value: "preview"
      - key: JAS_SI_GITHUB_CAPABILITY_BROKER_ENABLED
        value: "true"
      - key: JAS_SI_GITHUB_CAPABILITY_BROKER_DATABASE_URL
        sync: false
      - key: JAS_SI_GITHUB_CAPABILITY_APP_ID
        sync: false
      - key: JAS_SI_GITHUB_CAPABILITY_APP_PRIVATE_KEY_PATH
        value: "/etc/secrets/github-capability-app-private-key.pem"
      - key: JAS_SI_GITHUB_CAPABILITY_WORKLOAD_IDENTITIES
        sync: false
      - key: JAS_SI_GITHUB_BROKER_TLS_CERT_PATH
        value: "/etc/secrets/broker-server-cert.pem"
      - key: JAS_SI_GITHUB_BROKER_TLS_KEY_PATH
        value: "/etc/secrets/broker-server-key.pem"
      - key: JAS_SI_GITHUB_BROKER_CLIENT_CA_PATH
        value: "/etc/secrets/workload-client-ca.pem"
      - key: JAS_SI_GITHUB_BROKER_BIND_HOST
        value: "0.0.0.0"
      - key: JAS_SI_GITHUB_BROKER_PORT
        value: "8787"

  - type: worker
    name: jas-si-staging-agent-worker
    runtime: docker
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m jas_si_agent.agent_task_worker_supervisor
    autoDeploy: false
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: jas-si-staging-agent-shared
      - key: JAS_SI_AGENT_WORKER_DSN
        sync: false
      - key: JAS_SI_AGENT_WORKER_ID
        value: "8a2e9c61-9a47-4c3f-a631-8f9a5f1d02b7"
      - key: JAS_SI_AGENT_WORKER_POLL_SECONDS
        value: "2"
      - key: JAS_SI_GITHUB_CAPABILITY_BROKER_ENABLED
        value: "true"
      - key: JAS_SI_GITHUB_CAPABILITY_BROKER_URL
        value: "https://jas-si-staging-github-capability-broker:8787"
      - key: JAS_SI_GITHUB_CAPABILITY_CLIENT_CERT_PATH
        value: "/etc/secrets/worker-client-cert.pem"
      - key: JAS_SI_GITHUB_CAPABILITY_CLIENT_KEY_PATH
        value: "/etc/secrets/worker-client-key.pem"
      - key: JAS_SI_GITHUB_CAPABILITY_CA_BUNDLE_PATH
        value: "/etc/secrets/broker-server-ca.pem"
      - key: LOG_LEVEL
        value: "INFO"

  - type: worker
    name: jas-si-staging-agent-verifier
    runtime: docker
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m jas_si_agent.agent_task_verifier_supervisor
    autoDeploy: false
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: jas-si-staging-agent-shared
      - key: JAS_SI_AGENT_VERIFIER_DSN
        sync: false
      - key: JAS_SI_AGENT_VERIFIER_POLL_SECONDS
        value: "2"
      - key: JAS_SI_GITHUB_CAPABILITY_BROKER_ENABLED
        value: "true"
      - key: JAS_SI_GITHUB_CAPABILITY_BROKER_URL
        value: "https://jas-si-staging-github-capability-broker:8787"
      - key: JAS_SI_GITHUB_CAPABILITY_CLIENT_CERT_PATH
        value: "/etc/secrets/verifier-client-cert.pem"
      - key: JAS_SI_GITHUB_CAPABILITY_CLIENT_KEY_PATH
        value: "/etc/secrets/verifier-client-key.pem"
      - key: JAS_SI_GITHUB_CAPABILITY_CA_BUNDLE_PATH
        value: "/etc/secrets/broker-server-ca.pem"
      - key: JAS_SI_AGENT_VERIFIER_BATCH_SIZE
        value: "10"
      - key: JAS_SI_AGENT_VERIFIER_COLLECTOR_ID
        value: "jas-si-staging-verifier-v1"
      - key: LOG_LEVEL
        value: "INFO"

  - type: worker
    name: jas-si-staging-github-reconciler
    runtime: docker
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m jas_si_agent.github_installation_reconciler
    autoDeploy: false
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: jas-si-staging-agent-shared
      - key: JAS_SI_GITHUB_APP_ID
        sync: false
      - key: JAS_SI_GITHUB_APP_PRIVATE_KEY_B64
        sync: false
      - key: JAS_SI_GITHUB_RECONCILER_DATABASE_URL
        sync: false
      - key: JAS_SI_GITHUB_RECONCILER_POLL_SECONDS
        value: "15"
      - key: LOG_LEVEL
        value: "INFO"
