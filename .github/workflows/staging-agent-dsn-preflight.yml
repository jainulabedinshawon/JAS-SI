name: JAS-SI Staging Agent DSN Preflight

on:
  workflow_dispatch:

  push:
    branches:
      - ops/staging-dsn-preflight
    paths:
      - ".github/workflows/staging-agent-dsn-preflight.yml"

permissions:
  contents: read

concurrency:
  group: jas-si-staging-agent-dsn-preflight
  cancel-in-progress: true

jobs:
  verify-dedicated-staging-logins:
    name: Verify Staging Worker and Verifier DB grants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JAS_SI_AGENT_WORKER_DSN: ${{ secrets.JAS_SI_AGENT_WORKER_DSN }}
      JAS_SI_AGENT_VERIFIER_DSN: ${{ secrets.JAS_SI_AGENT_VERIFIER_DSN }}
    steps:
      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Install pinned PostgreSQL client
        run: python -m pip install --disable-pip-version-check "psycopg[binary]==3.3.8"

      - name: Verify both Staging DSNs without modifying the database
        shell: bash
        run: |
          python - <<'PY'
          import os
          import psycopg

          WORKER_ROUTINES = (
              "jas_si_agent_task_claim(uuid,integer)",
              "jas_si_agent_task_renew(uuid,uuid,bigint,integer)",
              "jas_si_agent_task_ack_cancel(uuid,uuid,bigint)",
              "jas_si_agent_task_report(uuid,uuid,bigint,jsonb)",
              "jas_si_agent_task_fail(uuid,uuid,bigint,text,integer)",
          )
          VERIFIER_ROUTINES = (
              "jas_si_agent_task_verification_claim(integer,integer)",
              "jas_si_agent_task_verification_release(uuid,uuid,uuid)",
              "jas_si_agent_task_finalize_success(uuid,uuid,uuid,uuid,text,bytea,jsonb,timestamptz)",
          )
          NO_DIRECT_TABLE_PRIVILEGES = (
              "SELECT", "INSERT", "UPDATE", "DELETE",
              "TRUNCATE", "REFERENCES", "TRIGGER",
          )

          def check_dsn(env_name, expected_login, capability, forbidden_capability,
                        routines, table_privileges):
              dsn = os.environ.get(env_name, "").strip()
              if not dsn:
                  raise SystemExit(f"FAIL: required repository secret {env_name} is empty")

              # Neon poolers reject statement_timeout in startup options.
              # Start a transaction first, then enforce read-only + timeout with
              # transaction-local settings before running any inspection query.
              with psycopg.connect(dsn, connect_timeout=10) as conn:
                  with conn.transaction():
                      with conn.cursor() as cur:
                          cur.execute("SET TRANSACTION READ ONLY")
                          cur.execute("SET LOCAL statement_timeout = '10s'")
                          cur.execute("""
                              SELECT session_user, current_user, current_database(),
                                     current_setting('server_version_num'),
                                     pg_catalog.pg_has_role(session_user, %s, 'MEMBER'),
                                     pg_catalog.pg_has_role(session_user, %s, 'MEMBER'),
                                     EXISTS (
                                         SELECT 1 FROM pg_catalog.pg_roles login_role
                                          WHERE login_role.rolname = session_user
                                            AND login_role.rolinherit = false
                                     ),
                                     EXISTS (
                                         SELECT 1
                                           FROM pg_catalog.pg_auth_members membership
                                           JOIN pg_catalog.pg_roles member_role
                                             ON member_role.oid = membership.member
                                           JOIN pg_catalog.pg_roles granted_role
                                             ON granted_role.oid = membership.roleid
                                          WHERE member_role.rolname = session_user
                                            AND granted_role.rolname = %s
                                            AND membership.admin_option = false
                                            AND membership.inherit_option = false
                                            AND membership.set_option = true
                                     )
                          """, (capability, forbidden_capability, capability))
                          authenticated_login, current_role, database, version, is_member, is_forbidden, login_noinherit, set_only_membership = cur.fetchone()

                          if authenticated_login != expected_login or current_role != expected_login:
                              raise SystemExit(
                                  f"FAIL: {env_name} authenticated as an unexpected login role"
                              )
                          if not is_member or is_forbidden or not login_noinherit or not set_only_membership:
                              raise SystemExit(
                                  f"FAIL: {expected_login} must have a non-admin SET-only capability membership and NOINHERIT login"
                              )

                          cur.execute("""
                              SELECT rolcanlogin, rolsuper, rolcreatedb, rolcreaterole,
                                     rolreplication, rolbypassrls
                                FROM pg_catalog.pg_roles
                               WHERE rolname = session_user
                          """)
                          attrs = cur.fetchone()
                          if attrs is None or attrs[0] is not True or any(attrs[1:]):
                              raise SystemExit(
                                  f"FAIL: {expected_login} has an elevated or invalid PostgreSQL login role attribute"
                              )

                          # The capability grant is SET-only, so validate routine
                          # and table privileges only after the explicit role switch.
                          cur.execute("SET LOCAL ROLE " + capability)
                          cur.execute("SELECT current_user")
                          if cur.fetchone()[0] != capability:
                              raise SystemExit(
                                  f"FAIL: {expected_login} could not assume its capability role"
                              )

                          for routine in routines:
                              signature = "public." + routine
                              cur.execute(
                                  "SELECT pg_catalog.to_regprocedure(%s) IS NOT NULL, "
                                  "pg_catalog.has_function_privilege(current_user, %s, 'EXECUTE')",
                                  (signature, signature),
                              )
                              exists, can_execute = cur.fetchone()
                              if not exists or not can_execute:
                                  raise SystemExit(
                                      f"FAIL: required routine grant missing for {expected_login}"
                                  )

                          for table, privileges in table_privileges.items():
                              cur.execute(
                                  "SELECT pg_catalog.to_regclass(%s) IS NOT NULL",
                                  ("public." + table,),
                              )
                              if not cur.fetchone()[0]:
                                  raise SystemExit(
                                      f"FAIL: required Staging table missing for {expected_login}"
                                  )
                              for privilege in privileges:
                                  cur.execute(
                                      "SELECT pg_catalog.has_table_privilege(current_user, %s, %s)",
                                      ("public." + table, privilege),
                                  )
                                  if cur.fetchone()[0]:
                                      raise SystemExit(
                                          f"FAIL: unexpected direct table privilege for {expected_login}"
                                      )

              print(
                  f"PASS: {expected_login}; database={database}; PostgreSQL={version}; "
                  f"{len(routines)} routine grants; direct table access denied."
              )

          check_dsn(
              "JAS_SI_AGENT_WORKER_DSN",
              "jas_si_agent_worker_login",
              "jas_si_agent_worker",
              "jas_si_agent_verifier",
              WORKER_ROUTINES,
              {
                  "jas_si_agent_tasks": NO_DIRECT_TABLE_PRIVILEGES,
                  "jas_si_agent_evidence_records": NO_DIRECT_TABLE_PRIVILEGES,
              },
          )
          check_dsn(
              "JAS_SI_AGENT_VERIFIER_DSN",
              "jas_si_agent_verifier_login",
              "jas_si_agent_verifier",
              "jas_si_agent_worker",
              VERIFIER_ROUTINES,
              {
                  "jas_si_agent_tasks": NO_DIRECT_TABLE_PRIVILEGES,
                  "jas_si_agent_evidence_records": NO_DIRECT_TABLE_PRIVILEGES,
              },
          )
          PY
