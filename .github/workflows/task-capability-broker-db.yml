name: JAS-SI Task Capability Broker DB Boundary

on:
  push:
    branches:
      - feat/task-scoped-github-capability-broker-db-v1
    paths:
      - "src/jas_si_agent/migrations/20261215_github_task_capability_broker.sql"
      - "tests/test_github_task_capability_broker_migration.py"
      - ".github/workflows/task-capability-broker-db.yml"
  pull_request:
    paths:
      - "src/jas_si_agent/migrations/20261215_github_task_capability_broker.sql"
      - "tests/test_github_task_capability_broker_migration.py"
      - ".github/workflows/task-capability-broker-db.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jas-si-broker-db-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker-db-boundary:
    name: PostgreSQL 16 broker authorization and replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jas_si_broker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: broker-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jas_si_broker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JAS_SI_BROKER_MIGRATION_TEST_DSN: postgresql://postgres:broker-ci-only-password@localhost:5432/jas_si_broker_test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: Compile source and tests
        run: python -m compileall -q src/jas_si_agent tests
      - name: Run broker migration contract and PostgreSQL integration
        run: python -m unittest discover -s tests -p 'test_github_task_capability_broker_migration.py' -v
