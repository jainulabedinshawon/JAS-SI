name: JAS-SI Agent Task Review Validation

on:
  pull_request:
    branches:
      - feat/durable-agent-task-store-v1
      - feat/verifier-inconclusive-review-lifecycle
    paths:
      - "src/jas_si_agent/agent_task_*.py"
      - "src/jas_si_agent/api.py"
      - "src/jas_si_agent/migrations/*agent_task*.sql"
      - "tests/test_agent_task_*.py"
      - ".github/workflows/agent-task-review-validation.yml"

permissions:
  contents: read

concurrency:
  group: jas-si-agent-task-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-task-tests:
    name: Python 3.10 agent task and review API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install locked runtime dependencies and pinned test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . pytest==8.3.5
      - name: Run focused agent task and review API regression suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_agent_task_api.py \
            tests/test_agent_task_verifier.py \
            tests/test_agent_task_verifier_store.py \
            tests/test_agent_task_verifier_supervisor.py \
            tests/test_agent_task_worker.py \
            tests/test_agent_task_worker_runtime.py \
            tests/test_agent_task_worker_store.py \
            tests/test_agent_task_worker_supervisor.py
