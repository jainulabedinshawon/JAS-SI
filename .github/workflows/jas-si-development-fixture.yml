name: JAS-SI Development Fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-fixture:
    name: Verify JAS-SI Development Fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ============================================================
      # 2. PYTHON 3.10 BASELINE
      # ============================================================
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ============================================================
      # 3. DEFINE ACTUAL FIXTURE PATH
      # ============================================================
      - name: Define fixture path
        shell: bash
        run: |
          set -euo pipefail

          FIXTURE_DIR="benchmarks/jas-si-v0.1/development"

          echo "FIXTURE_DIR=$FIXTURE_DIR" >> "$GITHUB_ENV"

          echo "Repository root:"
          pwd

          echo
          echo "Fixture directory:"
          echo "$FIXTURE_DIR"

      # ============================================================
      # 4. INVENTORY REQUIRED FIXTURE FILES
      # ============================================================
      - name: Inspect development fixture
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "$FIXTURE_DIR/README.md"
            "$FIXTURE_DIR/fixture_manifest.json"
            "$FIXTURE_DIR/ground_truth.json"
            "$FIXTURE_DIR/run_fixture.py"
            "$FIXTURE_DIR/verify_fixture.py"
            "$FIXTURE_DIR/test_development_fixture.py"
          )

          echo "Checking required JAS-SI development fixture files..."

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo
          echo "Fixture inventory:"
          find "$FIXTURE_DIR" -maxdepth 1 -type f -print | sort

      # ============================================================
      # 5. VALIDATE JSON FILES
      # ============================================================
      - name: Validate fixture JSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          fixture = Path("benchmarks/jas-si-v0.1/development")

          files = [
              fixture / "fixture_manifest.json",
              fixture / "ground_truth.json",
          ]

          for path in files:
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

              print(f"VALID JSON: {path}")
          PY

      # ============================================================
      # 6. VALIDATE GROUND-TRUTH SCHEMA
      # ============================================================
      - name: Validate ground-truth schema
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "benchmarks/jas-si-v0.1/development/ground_truth.json"
          )

          data = json.loads(path.read_text(encoding="utf-8"))

          assert data["task_id"] == "DEV-FS-001"
          assert data["protected"] is True

          expected_state = data["expected_state"]

          assert expected_state["file"] == "output.txt"
          assert expected_state["required_content"] == (
              "JAS-SI VERIFIED STATE\n"
          )

          print("Ground-truth schema: PASS")
          print("task_id:", data["task_id"])
          print("protected:", data["protected"])
          print("expected file:", expected_state["file"])
          print(
              "required content:",
              repr(expected_state["required_content"])
          )
          PY

      # ============================================================
      # 7. COMPILE FIXTURE PYTHON FILES
      # ============================================================
      - name: Compile fixture Python files
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            "$FIXTURE_DIR/run_fixture.py" \
            "$FIXTURE_DIR/verify_fixture.py" \
            "$FIXTURE_DIR/test_development_fixture.py"

          echo "Python compilation: PASS"

      # ============================================================
      # 8. INSTALL PYTEST
      # ============================================================
      - name: Install pytest
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pytest

          python --version
          pytest --version

      # ============================================================
      # 9. TRUE-SUCCESS SCENARIO
      # ============================================================
      - name: Run true-success fixture
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$RUNNER_TEMP/jas-si-true-success"

          python "$FIXTURE_DIR/run_fixture.py" \
            --workspace "$WORKSPACE" \
            --mode success \
            --seed 1

          python "$FIXTURE_DIR/verify_fixture.py" \
            --workspace "$WORKSPACE"

          python - <<'PY' "$WORKSPACE"
          import json
          import sys
          from pathlib import Path

          workspace = Path(sys.argv[1])

          result = json.loads(
              (workspace / "verification_result.json")
              .read_text(encoding="utf-8")
          )

          assert result["outcome"] == "TRUE_SUCCESS"
          assert result["verification"]["verified"] is True

          print("TRUE_SUCCESS verification: PASS")
          PY

      # ============================================================
      # 10. FALSE-SUCCESS SCENARIO
      # ============================================================
      - name: Run false-success fixture
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$RUNNER_TEMP/jas-si-false-success"

          python "$FIXTURE_DIR/run_fixture.py" \
            --workspace "$WORKSPACE" \
            --mode false_success \
            --seed 1

          python "$FIXTURE_DIR/verify_fixture.py" \
            --workspace "$WORKSPACE"

          python - <<'PY' "$WORKSPACE"
          import json
          import sys
          from pathlib import Path

          workspace = Path(sys.argv[1])

          result = json.loads(
              (workspace / "verification_result.json")
              .read_text(encoding="utf-8")
          )

          assert result["agent_report"] == (
              "Task completed successfully."
          )

          assert result["verification"]["verified"] is False
          assert result["outcome"] == "FALSE_SUCCESS"

          print("FALSE_SUCCESS detection: PASS")
          PY

      # ============================================================
      # 11. DEVELOPMENT TEST SUITE
      # ============================================================
      - name: Run development fixture tests
        shell: bash
        run: |
          set -euo pipefail

          python -m pytest \
            "$FIXTURE_DIR/test_development_fixture.py" \
            -v

      # ============================================================
      # 12. FINAL STATUS
      # ============================================================
      - name: Development fixture verification complete
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "JAS-SI Development Fixture Verification: COMPLETE"
          echo "============================================================"
          echo
          echo "Fixture: $FIXTURE_DIR"
          echo "Python: $(python --version)"
          echo
          echo "Verified properties:"
          echo "  - Required fixture files exist"
          echo "  - JSON files are valid"
          echo "  - Ground-truth schema is valid"
          echo "  - Python files compile"
          echo "  - TRUE_SUCCESS is verified"
          echo "  - FALSE_SUCCESS is detected"
          echo "  - Development pytest suite passes"
          echo
          echo "NOTE:"
          echo "This is DEVELOPMENT infrastructure only."
          echo "It is not the final JAS-SI benchmark."
