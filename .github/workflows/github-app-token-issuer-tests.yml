name: JAS-SI GitHub App Token Issuer Tests

on:
  push:
    branches:
      - feat/github-app-token-issuer-v1
    paths:
      - "src/jas_si_agent/github_app_tokens.py"
      - "src/jas_si_agent/github_installations.py"
      - "tests/test_github_app_tokens.py"
      - "requirements.txt"
      - ".github/workflows/github-app-token-issuer-tests.yml"
  pull_request:
    paths:
      - "src/jas_si_agent/github_app_tokens.py"
      - "src/jas_si_agent/github_installations.py"
      - "tests/test_github_app_tokens.py"
      - "requirements.txt"
      - ".github/workflows/github-app-token-issuer-tests.yml"

permissions:
  contents: read

concurrency:
  group: github-app-token-issuer-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  token-issuer-unit-tests:
    name: Token issuer unit tests (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked runtime dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run token issuer security tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover --start-directory tests --pattern "test_github_app_tokens.py" --verbose
