name: JAS-SI PHP SDK Validation

on:
  push:
    branches:
      - feat/php-sdk-v0.1
    paths:
      - "composer.json"
      - "sdks/php/**"
      - "CHANGELOG.md"
      - ".spectral.yaml"
      - ".github/workflows/php-sdk-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "composer.json"
      - "sdks/php/**"
      - "CHANGELOG.md"
      - ".spectral.yaml"
      - ".github/workflows/php-sdk-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jas-si-php-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-contract:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Lint OpenAPI contract with Spectral
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint sdks/php/openapi/jas-si-api-v1.yaml --ruleset .spectral.yaml

  php-sdk:
    name: PHP ${{ matrix.php-version }} validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: openapi-contract
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint PHP SDK files
        run: |
          find sdks/php -type f -name "*.php" -print0 |
            xargs -0 -r -n1 php -l

      - name: Start Prism mock server from OpenAPI contract
        run: |
          npx --yes @stoplight/prism-cli@5.14.2 mock sdks/php/openapi/jas-si-api-v1.yaml --host 127.0.0.1 --port 4010 > /tmp/jas-si-prism.log 2>&1 &
          echo $! > /tmp/jas-si-prism.pid
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:4010/; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/jas-si-prism.log
          exit 1

      - name: Run PHPUnit unit and Prism contract integration tests
        env:
          JAS_SI_MOCK_URL: http://127.0.0.1:4010
        run: composer test

      - name: Run PHPStan level 8
        run: composer analyse
