name: JAS-SI PHP SDK Validation

on:
  push:
    branches:
      - feat/php-sdk-v0.1
    paths:
      - "composer.json"
      - "sdks/php/**"
      - ".github/workflows/php-sdk-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "composer.json"
      - "sdks/php/**"
      - ".github/workflows/php-sdk-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jas-si-php-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-sdk:
    name: PHP ${{ matrix.php-version }} validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint PHP SDK files
        run: |
          find sdks/php -type f -name "*.php" -print0 |
            xargs -0 -r -n1 php -l

      - name: Run unit tests
        run: composer test

      - name: Run static analysis
        run: composer analyse
