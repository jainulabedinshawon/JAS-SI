
name: JAS-SI Vercel Preview Smoke Test

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Deployed Vercel Preview URL (HTTPS)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jas-si-preview-smoke-test
  cancel-in-progress: false

jobs:
  preview-smoke-test:
    name: Verify Live Preview API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Validate Preview URL
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          value = os.environ["PREVIEW_URL"].strip()
          parsed = urlsplit(value)

          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username
              or parsed.password
              or parsed.query
              or parsed.fragment
              or parsed.path not in ("", "/")
          ):
              raise SystemExit(
                  "Provide a valid HTTPS Preview origin only."
              )

          if not os.environ.get("VERCEL_AUTOMATION_BYPASS_SECRET"):
              raise SystemExit(
                  "Missing GitHub secret: "
                  "VERCEL_AUTOMATION_BYPASS_SECRET"
              )

          print("Preview URL and automation credential configured.")
          PY

      - name: Verify health and authentication
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base = os.environ["PREVIEW_URL"].strip().rstrip("/")
          bypass = os.environ["VERCEL_AUTOMATION_BYPASS_SECRET"]

          headers = {
              "Accept": "application/json",
              "x-vercel-protection-bypass": bypass,
          }

          health_request = Request(
              base + "/health",
              headers=headers,
          )

          try:
              with urlopen(health_request, timeout=20) as response:
                  health = json.loads(response.read())
          except HTTPError as error:
              raise SystemExit(
                  f"Health request failed: HTTP {error.code}. "
                  "Check Vercel protection bypass."
              )

          assert health.get("status") == "ok", health
          assert health.get("api_enabled") is True, health

          print("PASS: Preview health endpoint is operational.")

          payload = json.dumps({
              "action_id": "preview-smoke-test",
              "action": "read",
              "resource": "preview-smoke-test",
          }).encode()

          protected_headers = {
              **headers,
              "Content-Type": "application/json",
          }

          protected_request = Request(
              base + "/v1/authorize",
              data=payload,
              headers=protected_headers,
              method="POST",
          )

          try:
              with urlopen(protected_request, timeout=20) as response:
                  status = response.status
                  response_headers = response.headers
          except HTTPError as error:
              status = error.code
              response_headers = error.headers

          assert status == 401, (
              f"Expected application HTTP 401 without API key; "
              f"received {status}"
          )

          assert response_headers.get("WWW-Authenticate") == "ApiKey", (
              "401 did not contain the expected application "
              "WWW-Authenticate: ApiKey header. "
              "Check whether Vercel protection was bypassed."
          )

          print(
              "PASS: Application API rejects requests without API key."
          )
          print("PREVIEW SMOKE TEST PASSED.")
          PY
