name: JAS-SI Atomic API Key Provisioning PostgreSQL Tests

on:
  push:
    branches:
      - feat/github-installation-user-ownership-proof-v1
    paths:
      - "src/jas_si_agent/api_key_registry.py"
      - "src/jas_si_agent/migrations/**"
      - "tests/test_atomic_api_key_provisioning.py"
      - "requirements.lock.txt"
      - ".github/workflows/atomic-api-key-postgres.yml"

  pull_request:
    branches:
      - feat/github-webhook-http-ingress-v1
    paths:
      - "src/jas_si_agent/api_key_registry.py"
      - "src/jas_si_agent/migrations/**"
      - "tests/test_atomic_api_key_provisioning.py"
      - "requirements.lock.txt"
      - ".github/workflows/atomic-api-key-postgres.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jas-si-atomic-api-key-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atomic-api-key-postgres:
    name: Atomic API Key Provisioning (isolated PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jas_si_atomic_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jas_si_atomic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      JAS_SI_TEST_DATABASE_URL: postgresql://postgres:test-only-postgres-password@localhost:5432/jas_si_atomic_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt

      - name: Compile atomic provisioning test
        run: |
          python -m compileall -q src/jas_si_agent tests/test_atomic_api_key_provisioning.py

      - name: Run isolated atomic API-key provisioning integration tests
        run: |
          python -m unittest tests.test_atomic_api_key_provisioning -v
