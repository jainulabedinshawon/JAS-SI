
name: JAS-SI Pilot P8 Metric Recalculation

on:
  workflow_dispatch:

  push:
    paths:
      - "benchmarks/jas-si-v0.1/pilot/p8-metrics/**"
      - ".github/workflows/jas-si-pilot-p8-metric-recalculation.yml"

permissions:
  contents: read

jobs:
  p8-metric-recalculation:
    name: P8 Synthetic Metric Recalculation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Validate required files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("benchmarks/jas-si-v0.1/pilot/p8-metrics/run_p8_metrics.py"),
              Path("benchmarks/jas-si-v0.1/pilot/p8-metrics/fixtures/p8_metric_cases.json"),
              Path("benchmarks/jas-si-v0.1/pilot/p8-metrics/tests/test_p8_metrics.py"),
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit("Missing files:\n" + "\n".join(missing))
          print("Required P8 metric files: PASS")
          PY

      - name: Validate fixture JSON
        run: |
          python -m json.tool \
            benchmarks/jas-si-v0.1/pilot/p8-metrics/fixtures/p8_metric_cases.json \
            > /dev/null

      - name: Compile Python modules
        run: |
          python -m py_compile \
            benchmarks/jas-si-v0.1/pilot/p8-metrics/run_p8_metrics.py \
            benchmarks/jas-si-v0.1/pilot/p8-metrics/tests/test_p8_metrics.py

      - name: Run P8 unit tests
        working-directory: benchmarks/jas-si-v0.1/pilot/p8-metrics
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run metric recalculation
        run: |
          python benchmarks/jas-si-v0.1/pilot/p8-metrics/run_p8_metrics.py

      - name: Validate recalculated metrics
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path(
              "benchmarks/jas-si-v0.1/results/"
              "p8_metric_recalculation_result.json"
          )
          if not path.is_file():
              raise SystemExit("P8 result artifact was not created.")

          result = json.loads(path.read_text(encoding="utf-8"))
          assert result["condition"] == "P8_METRIC_RECALCULATION"
          assert result["evidence_type"] == "SYNTHETIC_DEVELOPMENT_FIXTURE"

          metrics = result["metrics"]
          assert metrics["total_evaluated_runs"] == 11

          primary = metrics["primary_false_success_rate"]
          assert primary["numerator_false_success"] == 2
          assert primary["denominator_true_success_plus_false_success"] == 6
          assert math.isclose(primary["value"], 2 / 6, rel_tol=0, abs_tol=1e-12)

          secondary = metrics["secondary_false_success_rate"]
          assert secondary["numerator_false_success"] == 2
          assert secondary["denominator_total_evaluated_runs"] == 11
          assert math.isclose(secondary["value"], 2 / 11, rel_tol=0, abs_tol=1e-12)

          unauthorized = metrics["unauthorized_action_rate_block_d"]
          assert unauthorized[
              "numerator_block_d_runs_with_unauthorized_attempt"
          ] == 2
          assert unauthorized["denominator_evaluated_block_d_runs"] == 3
          assert math.isclose(
              unauthorized["value"], 2 / 3, rel_tol=0, abs_tol=1e-12
          )

          print("P8 metric recalculation validation: PASS")
          print("Synthetic fixture only; not real agent-performance evidence.")
          PY

      - name: Upload P8 metric result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jas-si-p8-metric-recalculation
          path: benchmarks/jas-si-v0.1/results/p8_metric_recalculation_result.json
          if-no-files-found: error
          retention-days: 30
