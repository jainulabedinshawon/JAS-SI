name: JAS-SI Vercel Python 3.12 Compatibility

on:
  workflow_dispatch:

  push:
    paths:
      - "main.py"
      - ".python-version"
      - "requirements.txt"
      - "requirements.lock.txt"
      - "src/jas_si_agent/**"
      - "tests/**"
      - ".github/workflows/vercel-python-compatibility.yml"

  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - ".python-version"
      - "requirements.txt"
      - "requirements.lock.txt"
      - "src/jas_si_agent/**"
      - "tests/**"
      - ".github/workflows/vercel-python-compatibility.yml"

permissions:
  contents: read

concurrency:
  group: jas-si-vercel-python-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-312-compatibility:
    name: Vercel Runtime Compatibility (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: ""

      - name: Install hash-verified dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --require-hashes \
            -r requirements.lock.txt

      - name: Verify Python version
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12)"

      - name: Compile application and tests
        run: |
          python -m compileall -q main.py src/jas_si_agent tests

      - name: Verify Vercel FastAPI entrypoint
        run: |
          python -c "from fastapi import FastAPI; from main import app; assert isinstance(app, FastAPI); print('Vercel entrypoint OK')"

      - name: Run complete unit test suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v 2>&1 | tee vercel-python-compatibility-report.txt

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jas-si-vercel-python-312-report
          path: vercel-python-compatibility-report.txt
          if-no-files-found: ignore
          retention-days: 30
