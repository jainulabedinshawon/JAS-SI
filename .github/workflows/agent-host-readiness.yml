name: Agent Host Readiness and Container Health

on:
  push:
    branches:
      - feat/agent-host-readiness-health-v1
    paths:
      - "Dockerfile"
      - "requirements.lock.txt"
      - "src/jas_si_agent/agent_host_health.py"
      - "src/jas_si_agent/agent_task_worker_supervisor.py"
      - "src/jas_si_agent/agent_task_verifier_supervisor.py"
      - "tests/test_agent_host_health.py"
      - "tests/test_agent_task_worker_supervisor.py"
      - "tests/test_agent_task_verifier_supervisor.py"
      - ".github/workflows/agent-host-readiness.yml"
  pull_request:
    branches:
      - feat/agent-host-db-preflight-v1
    paths:
      - "Dockerfile"
      - "requirements.lock.txt"
      - "src/jas_si_agent/agent_host_health.py"
      - "src/jas_si_agent/agent_task_worker_supervisor.py"
      - "src/jas_si_agent/agent_task_verifier_supervisor.py"
      - "tests/test_agent_host_health.py"
      - "tests/test_agent_task_worker_supervisor.py"
      - "tests/test_agent_task_verifier_supervisor.py"
      - ".github/workflows/agent-host-readiness.yml"

permissions:
  contents: read

concurrency:
  group: agent-host-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supervisor-readiness-tests:
    name: Python 3.10 Supervisor and Readiness Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: Compile source and tests
        run: python -m compileall -q src/jas_si_agent tests
      - name: Run agent host readiness and supervisor tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_agent_host_health.py' -v
          python -m unittest discover -s tests -p 'test_agent_task_worker_supervisor.py' -v
          python -m unittest discover -s tests -p 'test_agent_task_verifier_supervisor.py' -v
          python -m unittest discover -s tests -p 'test_agent_task_host_preflight.py' -v

  worker-container-health:
    name: Docker Worker Health Endpoint Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build locked runtime image
        run: docker build --pull -t jas-si-agent-host:ci .
      - name: Start isolated worker health endpoint
        run: |
          docker run -d \
            --name jas-si-worker-health \
            -p 127.0.0.1:18004:8000 \
            jas-si-agent-host:ci \
            python -c "import time; from jas_si_agent.agent_host_health import AgentHostHealthServer, AgentHostHealthState; state=AgentHostHealthState(); state.mark_success(); server=AgentHostHealthServer(state); server.start(); time.sleep(3600)"
      - name: Verify Docker liveness and HTTP readiness
        run: |
          set -euo pipefail
          ready=false
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18004/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "${ready}" = "true"
          test "$(docker inspect jas-si-worker-health --format '{{.State.Health.Status}}')" = "healthy"
          curl --silent --fail http://127.0.0.1:18004/health
          curl --silent --fail http://127.0.0.1:18004/ready
      - name: Collect logs on failure
        if: failure()
        run: docker logs jas-si-worker-health || true
      - name: Cleanup
        if: always()
        run: docker rm -f jas-si-worker-health || true
