
name: JAS-SI Agent Authorization Tests

on:
  push:
    branches:
      - main
      - feat/jas-si-agent-mvp-safety-core
      - feat/jas-si-agent-authorization-tests
    paths:
      - "src/jas_si_agent/**"
      - "tests/test_*.py"
      - ".github/workflows/jas-si-agent-tests.yml"

  pull_request:
    branches:
      - main
      - feat/jas-si-agent-mvp-safety-core
    paths:
      - "src/jas_si_agent/**"
      - "tests/test_*.py"
      - ".github/workflows/jas-si-agent-tests.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jas-si-agent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorization-tests:
    name: Agent Unit Tests (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""

      - name: Verify Python version
        run: python --version

      - name: Compile source and tests
        run: |
          python -m compileall -q src/jas_si_agent tests

      - name: Run all discovered unit tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v
