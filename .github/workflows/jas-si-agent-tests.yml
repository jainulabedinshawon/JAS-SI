name: JAS-SI Agent Authorization Tests

on:
  push:
    branches:
      - main
      - feat/jas-si-agent-mvp-safety-core
      - feat/customer-identity-onboarding-v1
      - feat/jas-si-agent-authorization-tests
      - feat/github-webhook-http-ingress-v1
      - feat/github-webhook-durable-inbox-v1
      - feat/github-installation-user-ownership-proof-v1
      - feat/github-oauth-state-pkce-contract-v1
      - feat/github-capability-workload-identity-v1
      - feat/agent-task-db-principal-binding-v1
      - fix/shared-api-rate-limiter-v1
      - feat/tenant-github-installation-binding-v1
      - feat/github-installation-onboarding-security-v1
      - feat/configure-github-capability-identity-registry-v1
      - feat/task-scoped-github-capability-broker-db-v1
    paths:
      - "src/jas_si_agent/**"
      - "tests/test_*.py"
      - "docs/security/**"
      - "cloudflare/github-reconciler-cron/**"
      - ".github/workflows/jas-si-agent-tests.yml"

  pull_request:
    branches:
      - main
      - feat/jas-si-agent-mvp-safety-core
      - feat/customer-identity-onboarding-v1
      - feat/github-webhook-http-ingress-v1
      - feat/github-webhook-durable-inbox-v1
      - feat/github-installation-user-ownership-proof-v1
      - feat/github-oauth-state-pkce-contract-v1
      - feat/github-capability-workload-identity-v1
      - feat/agent-task-db-principal-binding-v1
      - fix/shared-api-rate-limiter-v1
      - integrate/pr101-tls-transport-into-agent-db-principal-v1
      - feat/configure-github-capability-identity-registry-v1
    paths:
      - "src/jas_si_agent/**"
      - "tests/test_*.py"
      - "docs/security/**"
      - "cloudflare/github-reconciler-cron/**"
      - ".github/workflows/jas-si-agent-tests.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jas-si-agent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorization-tests:
    name: Agent Unit Tests (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jas_si_broker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: broker-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jas_si_broker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JAS_SI_BROKER_MIGRATION_TEST_DSN: postgresql://postgres:broker-ci-only-password@localhost:5432/jas_si_broker_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt

      - name: Verify Python version
        run: python --version

      - name: Compile source and tests
        run: |
          python -m compileall -q src/jas_si_agent tests

      - name: Run all discovered unit tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v

      - name: Test Cloudflare webhook ingress proxy
        run: node --test cloudflare/github-reconciler-cron/worker.test.mjs
