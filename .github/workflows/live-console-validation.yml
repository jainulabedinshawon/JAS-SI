name: JAS-SI Live Console Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/jas_si_agent/api.py"
      - "src/jas_si_agent/dashboard.py"
      - "src/jas_si_agent/live_demo.py"
      - "tests/test_live_demo.py"
      - ".github/workflows/live-console-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/jas_si_agent/api.py"
      - "src/jas_si_agent/dashboard.py"
      - "src/jas_si_agent/live_demo.py"
      - "tests/test_live_demo.py"
      - ".github/workflows/live-console-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-console-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile application modules
        run: python -m compileall -q src/jas_si_agent

      - name: Test live console and developer dashboard routes
        run: python -m unittest tests.test_live_demo tests.test_dashboard
