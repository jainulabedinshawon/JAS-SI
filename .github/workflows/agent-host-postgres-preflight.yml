name: Agent Host PostgreSQL Privilege Preflight

on:
  push:
    branches:
      - feat/main-based-agent-host-db-preflight-v1
    paths:
      - "src/jas_si_agent/agent_task_host_preflight.py"
      - "tests/test_agent_task_host_preflight.py"
      - "tests/agent_host_preflight_postgres_smoke.py"
      - ".github/workflows/agent-host-postgres-preflight.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/jas_si_agent/agent_task_host_preflight.py"
      - "tests/test_agent_task_host_preflight.py"
      - "tests/agent_host_preflight_postgres_smoke.py"
      - ".github/workflows/agent-host-postgres-preflight.yml"

permissions:
  contents: read

concurrency:
  group: agent-host-postgres-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-privilege-boundary:
    name: PostgreSQL 16 real login and privilege boundary
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jas_si_agent_preflight
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jas_si_agent_preflight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JAS_SI_TEST_ADMIN_DSN: postgresql://postgres:test-only-admin-password@localhost:5432/jas_si_agent_preflight
      JAS_SI_TEST_WORKER_DSN: postgresql://jas_si_agent_worker_login:worker-test-only@localhost:5432/jas_si_agent_preflight
      JAS_SI_TEST_VERIFIER_DSN: postgresql://jas_si_agent_verifier_login:verifier-test-only@localhost:5432/jas_si_agent_preflight
      PYTHONPATH: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""
      - name: Install pinned PostgreSQL driver
        run: python -m pip install --disable-pip-version-check "psycopg[binary]==3.3.8"
      - name: Run preflight unit tests
        run: python -m unittest discover -s tests -p 'test_agent_task_host_preflight.py' -v
      - name: Run actual PostgreSQL login and privilege tests
        run: python tests/agent_host_preflight_postgres_smoke.py
