name: JAS-SI Pilot P5 Floor Ceiling Check

on:
  workflow_dispatch:
  push:
    paths:
      - "benchmarks/jas-si-v0.1/pilot/p5/**"
      - ".github/workflows/jas-si-pilot-p5.yml"

permissions:
  contents: read

jobs:
  p5-floor-ceiling:
    name: P5 Floor Ceiling Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Show Python version
        run: python --version

      - name: Validate required P5 files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("benchmarks/jas-si-v0.1/pilot/p5/README.md"),
              Path("benchmarks/jas-si-v0.1/pilot/p5/fixtures/p5_floor_ceiling_cases.json"),
              Path("benchmarks/jas-si-v0.1/pilot/p5/run_p5.py"),
              Path("benchmarks/jas-si-v0.1/pilot/p5/tests/test_p5_floor_ceiling.py"),
          ]

          missing = [str(path) for path in required if not path.is_file()]

          if missing:
              raise SystemExit("Missing required files:\n" + "\n".join(missing))

          print(f"Validated {len(required)} required files.")
          PY

      - name: Validate P5 fixture JSON
        run: |
          python -m json.tool \
            benchmarks/jas-si-v0.1/pilot/p5/fixtures/p5_floor_ceiling_cases.json \
            > /dev/null

      - name: Compile P5 Python modules
        run: |
          python -m py_compile \
            benchmarks/jas-si-v0.1/pilot/p5/run_p5.py \
            benchmarks/jas-si-v0.1/pilot/p5/tests/test_p5_floor_ceiling.py

      - name: Run P5 unit tests
        run: |
          python -m unittest discover \
            -s benchmarks/jas-si-v0.1/pilot/p5/tests \
            -p "test_*.py" \
            -v

      - name: Run P5 apparatus
        run: |
          python benchmarks/jas-si-v0.1/pilot/p5/run_p5.py

      - name: Validate P5 result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "benchmarks/jas-si-v0.1/results/p5_floor_ceiling_result.json"
          )

          if not path.is_file():
              raise SystemExit("P5 result file was not created.")

          result = json.loads(path.read_text(encoding="utf-8"))

          assert result["all_cases_passed"] is True
          assert result["failed_cases"] == 0
          assert result["pass_rate"] == 1.0

          print("P5 result validation: PASS")
          print(f"Cases: {result['case_count']}")
          print(f"Pass rate: {result['pass_rate']}")
          PY

      - name: Upload P5 result
        uses: actions/upload-artifact@v4
        with:
          name: jas-si-p5-floor-ceiling-result
          path: benchmarks/jas-si-v0.1/results/p5_floor_ceiling_result.json
          if-no-files-found: error
          retention-days: 30
