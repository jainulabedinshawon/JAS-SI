
name: JAS-SI Pilot P6 Label Audit

on:
  workflow_dispatch:

  push:
    paths:
      - "benchmarks/jas-si-v0.1/pilot/p6/**"
      - ".github/workflows/jas-si-pilot-p6.yml"

permissions:
  contents: read

jobs:
  p6-label-audit:
    name: P6 Label Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Show Python version
        shell: bash
        run: |
          set -euo pipefail
          python --version

      - name: Validate required P6 files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "benchmarks/jas-si-v0.1/pilot/p6/README.md"
            "benchmarks/jas-si-v0.1/pilot/p6/fixtures/p6_label_audit_cases.json"
            "benchmarks/jas-si-v0.1/pilot/p6/run_p6.py"
            "benchmarks/jas-si-v0.1/pilot/p6/tests/test_p6_label_audit.py"
          )

          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
            echo "Validated: $file"
          done

      - name: Validate P6 fixture JSON
        shell: bash
        run: |
          set -euo pipefail

          python -m json.tool \
            benchmarks/jas-si-v0.1/pilot/p6/fixtures/p6_label_audit_cases.json \
            > /dev/null

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "benchmarks/jas-si-v0.1/pilot/p6/fixtures/"
              "p6_label_audit_cases.json"
          )

          cases = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(cases, list) or not cases:
              raise SystemExit(
                  "P6 fixture must be a non-empty JSON array"
              )

          ids = [case.get("case_id") for case in cases
                 if isinstance(case, dict)]

          if len(ids) != len(cases):
              raise SystemExit("Every P6 case must be an object")

          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate P6 case IDs detected")

          if len(cases) != 8:
              raise SystemExit(
                  f"Expected 8 controlled fixture cases; got {len(cases)}"
              )

          print(f"P6 fixture validation: PASS ({len(cases)} cases)")
          PY

      - name: Compile P6 Python modules
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            benchmarks/jas-si-v0.1/pilot/p6/run_p6.py \
            benchmarks/jas-si-v0.1/pilot/p6/tests/test_p6_label_audit.py

      - name: Run P6 unit tests
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest discover \
            -s benchmarks/jas-si-v0.1/pilot/p6/tests \
            -p "test_*.py" \
            -v

      - name: Run P6 apparatus
        shell: bash
        run: |
          set -euo pipefail

          python benchmarks/jas-si-v0.1/pilot/p6/run_p6.py

      - name: Validate P6 result
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path(
              "benchmarks/jas-si-v0.1/results/"
              "p6_label_audit_result.json"
          )

          if not path.is_file():
              raise SystemExit("P6 result file was not created")

          result = json.loads(path.read_text(encoding="utf-8"))

          required_keys = {
              "condition",
              "case_count",
              "passed_cases",
              "failed_cases",
              "pass_rate",
              "correctly_labeled_cases",
              "incorrectly_labeled_cases",
              "all_cases_passed",
              "results",
          }

          missing = required_keys - result.keys()
          if missing:
              raise SystemExit(
                  f"Missing result keys: {sorted(missing)}"
              )

          if result["condition"] != "P6_LABEL_AUDIT":
              raise SystemExit("Unexpected P6 result condition")

          if result["case_count"] != 8:
              raise SystemExit("Expected 8 P6 result cases")

          if result["passed_cases"] != 8:
              raise SystemExit("Not all P6 cases passed")

          if result["failed_cases"] != 0:
              raise SystemExit("P6 contains failed cases")

          rate = result["pass_rate"]
          if (
              isinstance(rate, bool)
              or not isinstance(rate, (int, float))
              or not math.isfinite(rate)
              or rate != 1.0
          ):
              raise SystemExit("P6 pass rate must equal 1.0")

          if result["all_cases_passed"] is not True:
              raise SystemExit("P6 all_cases_passed is not true")

          if result["correctly_labeled_cases"] != 4:
              raise SystemExit(
                  "Expected four correctly labeled fixture cases"
              )

          if result["incorrectly_labeled_cases"] != 4:
              raise SystemExit(
                  "Expected four deliberately mislabeled cases"
              )

          records = result["results"]
          if not isinstance(records, list) or len(records) != 8:
              raise SystemExit("P6 result records are inconsistent")

          if not all(
              isinstance(item, dict)
              and item.get("passed") is True
              for item in records
          ):
              raise SystemExit(
                  "One or more P6 fixture expectations failed"
              )

          print("P6 result validation: PASS")
          print(f"Cases: {result['case_count']}")
          print(f"Passed: {result['passed_cases']}")
          print(f"Failed: {result['failed_cases']}")
          print(f"Pass rate: {rate:.6f}")
          print(
              "Correctly labeled: "
              f"{result['correctly_labeled_cases']}"
          )
          print(
              "Deliberately mislabeled and detected: "
              f"{result['incorrectly_labeled_cases']}"
          )
          print(
              "Scope: controlled label-audit fixture; "
              "not real-world ground-truth verification."
          )
          PY

      - name: Upload P6 result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jas-si-p6-label-audit-result
          path: benchmarks/jas-si-v0.1/results/p6_label_audit_result.json
          if-no-files-found: error
          retention-days: 30
