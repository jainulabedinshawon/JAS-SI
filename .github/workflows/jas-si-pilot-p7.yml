
name: JAS-SI Pilot P7 Leakage Check

on:
  workflow_dispatch:

  push:
    paths:
      - "benchmarks/jas-si-v0.1/pilot/p7/**"
      - ".github/workflows/jas-si-pilot-p7.yml"

permissions:
  contents: read

jobs:
  p7-leakage-check:
    name: P7 Leakage Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Validate required P7 files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("benchmarks/jas-si-v0.1/pilot/p7/README.md"),
              Path("benchmarks/jas-si-v0.1/pilot/p7/fixtures/p7_leakage_cases.json"),
              Path("benchmarks/jas-si-v0.1/pilot/p7/run_p7.py"),
              Path("benchmarks/jas-si-v0.1/pilot/p7/tests/test_p7_leakage_check.py"),
          ]

          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing files:\n" + "\n".join(missing))

          print(f"Validated {len(required)} required P7 files.")
          PY

      - name: Validate P7 fixture JSON
        run: |
          python -m json.tool \
            benchmarks/jas-si-v0.1/pilot/p7/fixtures/p7_leakage_cases.json \
            > /dev/null

      - name: Compile P7 Python modules
        run: |
          python -m py_compile \
            benchmarks/jas-si-v0.1/pilot/p7/run_p7.py \
            benchmarks/jas-si-v0.1/pilot/p7/tests/test_p7_leakage_check.py

      - name: Run P7 unit tests
        run: |
          PYTHONPATH=benchmarks/jas-si-v0.1/pilot/p7 \
          python -m unittest discover \
            -s benchmarks/jas-si-v0.1/pilot/p7/tests \
            -p "test_*.py" \
            -v

      - name: Run P7 leakage apparatus
        run: |
          python benchmarks/jas-si-v0.1/pilot/p7/run_p7.py

      - name: Validate P7 result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "benchmarks/jas-si-v0.1/results/p7_leakage_check_result.json"
          )

          if not path.is_file():
              raise SystemExit("P7 result file was not created.")

          result = json.loads(path.read_text(encoding="utf-8"))

          expected = {
              "condition": "P7_LEAKAGE_CHECK",
              "case_count": 6,
              "passed_cases": 6,
              "failed_cases": 0,
              "pass_rate": 1.0,
              "all_cases_passed": True,
              "cases_with_detected_leakage": 4,
              "cases_without_detected_leakage": 2,
          }

          for key, value in expected.items():
              if result.get(key) != value:
                  raise SystemExit(
                      f"P7 result mismatch for {key}: "
                      f"expected {value!r}, got {result.get(key)!r}"
                  )

          cases = result.get("results")
          if not isinstance(cases, list) or len(cases) != 6:
              raise SystemExit("P7 must return exactly 6 case results.")

          if any(case.get("passed") is not True for case in cases):
              raise SystemExit("One or more P7 fixture cases failed.")

          ids = [case.get("case_id") for case in cases]
          if len(set(ids)) != 6 or any(not item for item in ids):
              raise SystemExit("P7 case IDs must be present and unique.")

          print("P7 result validation: PASS")
          print(f"Cases: {result['case_count']}")
          print(f"Passed: {result['passed_cases']}")
          print(f"Detected-leakage controls: {result['cases_with_detected_leakage']}")
          print(f"Clean controls: {result['cases_without_detected_leakage']}")
          PY

      - name: Upload P7 result artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jas-si-p7-leakage-check-result
          path: benchmarks/jas-si-v0.1/results/p7_leakage_check_result.json
          if-no-files-found: error
          retention-days: 30
