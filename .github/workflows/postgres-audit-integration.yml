name: JAS-SI PostgreSQL Audit Integration

on:
  workflow_dispatch:

  push:
    paths:
      - "src/jas_si_agent/postgres_security_event_store.py"
      - "src/jas_si_agent/api.py"
      - "src/jas_si_agent/api_key_registry.py"
      - "src/jas_si_agent/customer_identity.py"
      - "src/jas_si_agent/customer_rate_limit.py"
      - "src/jas_si_agent/migrations/**"
      - "tests/test_postgres_security_event_store.py"
      - "tests/test_postgres_security_event_store_integration.py"
      - "tests/test_usage_meter_postgres_integration.py"
      - "tests/test_customer_identity_postgres_integration.py"
      - "tests/test_customer_api_key_rls_integration.py"
      - "tests/test_customer_api_key_security_integration.py"
      - "tests/test_api_rate_limit_postgres_integration.py"
      - "requirements.lock.txt"
      - ".github/workflows/postgres-audit-integration.yml"

  pull_request:
    branches:
      - main
    paths:
      - "src/jas_si_agent/postgres_security_event_store.py"
      - "src/jas_si_agent/api.py"
      - "src/jas_si_agent/api_key_registry.py"
      - "src/jas_si_agent/customer_identity.py"
      - "src/jas_si_agent/customer_rate_limit.py"
      - "src/jas_si_agent/migrations/**"
      - "tests/test_postgres_security_event_store.py"
      - "tests/test_postgres_security_event_store_integration.py"
      - "tests/test_usage_meter_postgres_integration.py"
      - "tests/test_customer_identity_postgres_integration.py"
      - "tests/test_customer_api_key_rls_integration.py"
      - "requirements.lock.txt"
      - ".github/workflows/postgres-audit-integration.yml"

permissions:
  contents: read

concurrency:
  group: jas-si-postgres-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: PostgreSQL 16 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jas_si_test
          POSTGRES_USER: jas_si
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jas_si -d jas_si_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JAS_SI_TEST_DATABASE_URL: postgresql://jas_si:test-only-password@localhost:5432/jas_si_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock.txt

      - name: Compile PostgreSQL tests
        run: |
          python -m compileall -q src/jas_si_agent tests

      - name: Run PostgreSQL adapter tests
        run: |
          python -m unittest \
            tests.test_postgres_security_event_store \
            tests.test_postgres_security_event_store_integration \
            tests.test_usage_meter_postgres_integration \
            tests.test_customer_identity_postgres_integration \
            tests.test_customer_api_key_rls_integration \
            tests.test_customer_api_key_security_integration \
            tests.test_api_rate_limit_postgres_integration \
            -v
