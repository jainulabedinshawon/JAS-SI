name: JAS-SI Dependency Lock Verification

on:
  workflow_dispatch:

  push:
    paths:
      - "requirements.in"
      - "requirements.txt"
      - "requirements.lock.txt"
      - "src/**"
      - "tests/**"
      - ".github/workflows/dependency-lock-verification.yml"

  pull_request:
    branches:
      - main
      - feat/agent-host-readiness-health-v1
      - feat/github-app-token-issuer-v1
      - feat/github-webhook-durable-inbox-v1
      - feat/github-webhook-http-ingress-v1
      - feat/task-scoped-github-capability-broker-db-v1
    paths:
      - "requirements.in"
      - "requirements.txt"
      - "requirements.lock.txt"
      - "src/**"
      - "tests/**"
      - ".github/workflows/dependency-lock-verification.yml"

permissions:
  contents: read

concurrency:
  group: jas-si-dependency-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-and-test:
    name: Resolve and Verify Python 3.10 Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""

      - name: Install pinned lock generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-tools==7.7.0"

      - name: Verify committed lock remains consistent with inputs
        run: |
          pip-compile \
            --resolver=backtracking \
            --generate-hashes \
            --output-file=requirements.lock.txt \
            requirements.in
          git diff --exit-code -- requirements.lock.txt

      - name: Verify runtime pins match the committed lock
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def pins(path):
              result = {}
              for line in Path(path).read_text().splitlines():
                  line = line.strip()
                  if not line or line.startswith("#") or line.startswith("-"):
                      continue
                  match = re.match(r"^([A-Za-z0-9_.-]+)(?:\[[^]]+\])?==([^\s;]+)", line)
                  if match:
                      name = re.sub(r"[-_.]+", "-", match.group(1)).lower()
                      result[name] = match.group(2)
              return result

          runtime = pins("requirements.txt")
          locked = pins("requirements.lock.txt")
          if runtime != locked:
              missing = sorted(set(locked) - set(runtime))
              extra = sorted(set(runtime) - set(locked))
              changed = sorted(k for k in set(runtime) & set(locked) if runtime[k] != locked[k])
              raise SystemExit(f"Runtime/lock mismatch: missing={missing}, extra={extra}, changed={changed}")
          print(f"Runtime pins match all {len(locked)} locked packages.")
          PY

      - name: Install committed locked dependencies
        run: |
          python -m pip install \
            --require-hashes \
            -r requirements.lock.txt

      - name: Verify source compilation
        run: |
          python -m compileall -q src/jas_si_agent tests

      - name: Run complete unit-test suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v 2>&1 | tee dependency-lock-test-report.txt

      - name: Upload lock and test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jas-si-dependency-lock-review
          path: |
            requirements.lock.txt
            dependency-lock-test-report.txt
          if-no-files-found: warn
          retention-days: 30
