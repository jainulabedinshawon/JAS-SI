
name: JAS-SI Dependency Lock Verification

on:
  workflow_dispatch:

  push:
    paths:
      - "requirements.in"
      - "requirements.txt"
      - "src/**"
      - "tests/**"
      - ".github/workflows/dependency-lock-verification.yml"

  pull_request:
    branches:
      - main
    paths:
      - "requirements.in"
      - "requirements.txt"
      - "src/**"
      - "tests/**"
      - ".github/workflows/dependency-lock-verification.yml"

permissions:
  contents: read

concurrency:
  group: jas-si-dependency-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-and-test:
    name: Resolve and Verify Python 3.10 Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""

      - name: Install lock generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools

      - name: Generate exact dependency lock with hashes
        run: |
          pip-compile \
            --resolver=backtracking \
            --generate-hashes \
            --output-file=requirements.lock.txt \
            requirements.in

      - name: Install locked dependencies
        run: |
          python -m pip install \
            --require-hashes \
            -r requirements.lock.txt

      - name: Verify source compilation
        run: |
          python -m compileall -q src/jas_si_agent tests

      - name: Run complete unit-test suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v 2>&1 | tee dependency-lock-test-report.txt

      - name: Upload generated lock and test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jas-si-dependency-lock-review
          path: |
            requirements.lock.txt
            dependency-lock-test-report.txt
          if-no-files-found: warn
          retention-days: 30
