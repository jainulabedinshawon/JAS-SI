name: JAS-SI Protected Staging API Authentication Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jas-si-staging-key-provisioning
  cancel-in-progress: false

jobs:
  provision:
    name: Approved staging key issuance
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/developer-console-landing-v0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: jas-si-staging-provisioning

    steps:
      - name: Checkout the pinned PR #24 Preview source
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.10
        id: setup_python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""

      - name: Install hash-locked dependencies
        id: install_deps
        run: python -m pip install --require-hashes -r requirements.lock.txt

      - name: Run in-memory staging API smoke test and revoke key
        env:
          JAS_SI_PROVISIONER_DATABASE_URL: ${{ secrets.JAS_SI_PROVISIONER_DATABASE_URL }}
          JAS_SI_API_KEY_PEPPER: ${{ secrets.JAS_SI_API_KEY_PEPPER }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_ACTOR: ${{ github.actor }}
          JAS_SI_PREVIEW_BASE_URL: https://jas-si-git-feat-developer-console-b54d92-jainulabedinshan-3242.vercel.app
        run: python tools/staging_api_smoke_test.py

      - name: Ensure this run has no active staging key
        if: always() && steps.checkout.outcome == 'success' && steps.setup_python.outcome == 'success' && steps.install_deps.outcome == 'success'
        env:
          JAS_SI_PROVISIONER_DATABASE_URL: ${{ secrets.JAS_SI_PROVISIONER_DATABASE_URL }}
          JAS_SI_API_KEY_PEPPER: ${{ secrets.JAS_SI_API_KEY_PEPPER }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python tools/revoke_staging_key_for_run.py

