name: JAS-SI Protected Staging API Key Provisioning

on:
  workflow_dispatch:
    inputs:
      key_name:
        description: Short internal staging key label
        required: true
        type: string
      scope:
        description: Exactly one least-privilege API scope
        required: true
        type: choice
        options:
          - authorization:check
          - outcomes:submit
          - github:evidence:verify
      expires_in_days:
        description: Short staging-key lifetime
        required: true
        type: choice
        options:
          - "1"
          - "7"

permissions:
  contents: read

concurrency:
  group: jas-si-staging-key-provisioning
  cancel-in-progress: false

jobs:
  provision:
    name: Approved staging key issuance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: jas-si-staging-provisioning

    steps:
      - name: Checkout trusted default-branch source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt

      - name: Run in-memory staging API smoke test and revoke key
        env:
          JAS_SI_PROVISIONER_DATABASE_URL: ${{ secrets.JAS_SI_PROVISIONER_DATABASE_URL }}
          JAS_SI_API_KEY_PEPPER: ${{ secrets.JAS_SI_API_KEY_PEPPER }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python tools/staging_api_smoke_test.py


      - name: Revoke key if artifact delivery failed
        if: failure() && steps.provision.outputs.key_id != ''
        env:
          JAS_SI_PROVISIONER_DATABASE_URL: ${{ secrets.JAS_SI_PROVISIONER_DATABASE_URL }}
          JAS_SI_API_KEY_PEPPER: ${{ secrets.JAS_SI_API_KEY_PEPPER }}
        run: |
          python tools/api_keys.py revoke-key \
            --key-id "${{ steps.provision.outputs.key_id }}" \
            --revoked-by "github-actions-failure-cleanup" \
            --run-id "github-actions-cleanup:${{ github.run_id }}"
