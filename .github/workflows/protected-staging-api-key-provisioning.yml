name: JAS-SI Protected Staging API Key Provisioning

on:
  workflow_dispatch:
    inputs:
      key_name:
        description: Short internal staging key label
        required: true
        type: string
      scope:
        description: Exactly one least-privilege API scope
        required: true
        type: choice
        options:
          - authorization:check
          - outcomes:submit
          - github:evidence:verify
      expires_in_days:
        description: Short staging-key lifetime
        required: true
        type: choice
        options:
          - "1"
          - "7"
      recipient_public_key:
        description: Operator OpenPGP PUBLIC key armor (never provide a private key)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jas-si-staging-key-provisioning
  cancel-in-progress: false

jobs:
  provision:
    name: Approved staging key issuance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: jas-si-staging-provisioning

    steps:
      - name: Checkout trusted default-branch source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt

      - name: Issue and encrypt one-time API key
        id: provision
        env:
          JAS_SI_PROVISIONER_DATABASE_URL: ${{ secrets.JAS_SI_PROVISIONER_DATABASE_URL }}
          JAS_SI_API_KEY_PEPPER: ${{ secrets.JAS_SI_API_KEY_PEPPER }}
          JAS_SI_ALLOWED_TENANT_ID: "277b9f5a-160a-44d6-b47f-706decdfda03"
          RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
        run: |
          python tools/provision_key_encrypted.py \
            --tenant-id "277b9f5a-160a-44d6-b47f-706decdfda03" \
            --key-name "${{ inputs.key_name }}" \
            --scope "${{ inputs.scope }}" \
            --expires-in-days "${{ inputs.expires_in_days }}" \
            --run-id "github-actions:${{ github.run_id }}" \
            --output-dir delivery

      - name: Upload ciphertext-only delivery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jas-si-encrypted-staging-key-${{ github.run_id }}
          path: delivery/
          if-no-files-found: error
          retention-days: 1

      - name: Revoke key if artifact delivery failed
        if: failure() && steps.provision.outputs.key_id != ''
        env:
          JAS_SI_PROVISIONER_DATABASE_URL: ${{ secrets.JAS_SI_PROVISIONER_DATABASE_URL }}
          JAS_SI_API_KEY_PEPPER: ${{ secrets.JAS_SI_API_KEY_PEPPER }}
        run: |
          python tools/api_keys.py revoke-key \
            --key-id "${{ steps.provision.outputs.key_id }}" \
            --revoked-by "github-actions-failure-cleanup" \
            --run-id "github-actions-cleanup:${{ github.run_id }}"
