name: JAS-SI Clean Migration Chain Replay

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feat/customer-identity-onboarding-v1
      - fix/tenant-suspension-locking-after-onboarding-fix
      - feat/durable-agent-task-store-v1
      - feat/verifier-inconclusive-review-lifecycle-rebased
      - feat/customer-human-review-decisions-rebased
    paths:
      - "src/jas_si_agent/migrations/**"
      - ".github/workflows/migration-chain-replay.yml"
      - "tests/test_customer_identity_postgres_integration.py"

permissions:
  contents: read

concurrency:
  group: jas-si-migration-chain-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-postgres-replay:
    name: PostgreSQL 16 clean replay and idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jas_si_migration_replay
          POSTGRES_USER: jas_si
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jas_si -d jas_si_migration_replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JAS_SI_MIGRATION_REPLAY_DATABASE_URL: postgresql://jas_si:test-only-password@localhost:5432/jas_si_migration_replay
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock.txt
      - name: Replay every migration twice on a clean database
        run: |
          python - <<'PY'
          import os
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import sys
          import psycopg

          root = Path.cwd()
          sys.path.insert(0, str(root / "src"))
          migration_dir = root / "src" / "jas_si_agent" / "migrations"
          migrations = (
              "001_create_audit_tables.sql",
              "002_create_tenant_api_keys.sql",
              "003_atomic_api_key_provisioning.sql",
              "004_audit_event_id_identity.sql",
              "005_provisioner_tenant_row_lock.sql",
              "006_api_key_registry_role_grants.sql",
              "007_customer_api_key_self_service.sql",
              "20261110_customer_identity.sql",
              "20261112_customer_identity_routines.sql",
              "20261113_customer_api_key_routines.sql",
              "20261110_customer_rate_limits.sql",
              "20261110_usage_metering.sql",
              "20261110_usage_idempotency_fingerprint.sql",
              "20261111_usage_append_only_role_grants.sql",
              "20261114_customer_usage_read_routines.sql",
              "20261115_api_key_auth_boundary.sql",
              "20261116_api_key_bound_usage_routines.sql",
              "20261117_runtime_usage_routine_only.sql",
              "20261118_shared_api_rate_limits.sql",
          )
          # These security and agent migrations are required for this branch's
          # complete schema chain. Missing files must fail replay rather than
          # silently reducing the migration set being tested.
          required_acl_migrations = (
              "20261119_general_runtime_customer_identity_acl.sql",
              "20261120_api_key_auth_runtime_tenant_acl.sql",
              "20261115z_api_key_auth_tenant_lock_reassert.sql",
              "20261121_security_audit_writer_boundary.sql",
              "20261122_customer_rate_limit_owner_boundary.sql",
              "20261123_agent_task_store.sql",
              "20261123_agent_task_scope_allowlist.sql",
              "20261124_agent_task_worker_lifecycle.sql",
              "20261125_agent_task_usage_scope.sql",
              "20261126_agent_task_nonretryable_failures.sql",
              "20261127_agent_task_evidence_finalization.sql",
              "20261128_agent_task_verifier_claims.sql",
              "20261129_agent_runtime_default_acl_boundary.sql",
              "20261130_customer_tenant_active_guard_reassert.sql",
              "20261130a_general_runtime_default_acl_boundary.sql",
              "20261201_agent_task_verifier_inconclusive_lifecycle.sql",
              "20261202_agent_task_human_review_decisions.sql",
              "20261203_agent_task_human_review_queue.sql",
              "20261204_agent_task_evidence_recollection.sql",
          )
          missing_acl_migrations = [
              name for name in required_acl_migrations
              if not migration_dir.joinpath(name).is_file()
          ]
          if missing_acl_migrations:
              raise SystemExit(
                  "Missing required security/agent migrations: "
                  + ", ".join(missing_acl_migrations)
              )
          migrations = migrations + required_acl_migrations

          dsn = os.environ["JAS_SI_MIGRATION_REPLAY_DATABASE_URL"]
          with psycopg.connect(dsn) as conn, conn.cursor() as cur:
              for role in (
                  "jas_si_runtime", "jas_si_provisioner", "jas_si_customer_runtime",
                  "neondb_owner", "jas_si_agent_worker_login",
                  "jas_si_agent_verifier_login",
              ):
                  cur.execute("SELECT 1 FROM pg_catalog.pg_roles WHERE rolname=%s", (role,))
                  if cur.fetchone() is None:
                      cur.execute(
                          f'CREATE ROLE "{role}" NOLOGIN NOSUPERUSER NOCREATEDB '
                          "NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT"
                      )

              # Seed the known-bad future-object grants so the ACL boundary
              # migration proves it removes them on every clean replay.
              cur.execute(
                  "ALTER DEFAULT PRIVILEGES FOR ROLE neondb_owner IN SCHEMA public "
                  "GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO jas_si_agent_worker_login"
              )
              cur.execute(
                  "ALTER DEFAULT PRIVILEGES FOR ROLE neondb_owner IN SCHEMA public "
                  "GRANT SELECT, USAGE, UPDATE ON SEQUENCES TO jas_si_agent_worker_login"
              )
              cur.execute(
                  "ALTER DEFAULT PRIVILEGES FOR ROLE neondb_owner IN SCHEMA public "
                  "GRANT SELECT ON TABLES TO jas_si_agent_verifier_login"
              )
              cur.execute(
                  "ALTER DEFAULT PRIVILEGES FOR ROLE neondb_owner IN SCHEMA public "
                  "GRANT SELECT ON SEQUENCES TO jas_si_agent_verifier_login"
              )

              for replay in (1, 2):
                  for name in migrations:
                      path = migration_dir / name
                      if not path.is_file():
                          raise SystemExit(f"Missing migration in canonical replay order: {name}")
                      cur.execute(path.read_text(encoding="utf-8"))
                  print(f"Migration pass {replay}: {len(migrations)} files applied")

              cur.execute("""
                  SELECT
                    pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','SELECT')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','INSERT')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','UPDATE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','DELETE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','TRUNCATE')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_usage_events','SELECT')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_usage_events','INSERT')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_usage_events','UPDATE')
              """)
              if cur.fetchone()[0]:
                  raise SystemExit("jas_si_runtime regained direct usage-event table/column access")

              cur.execute("""
                  SELECT
                    pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','SELECT')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','INSERT')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','UPDATE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','DELETE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','TRUNCATE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','REFERENCES')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','TRIGGER')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_tenants','SELECT')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_tenants','INSERT')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_tenants','UPDATE')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_tenants','REFERENCES')
              """)
              if cur.fetchone()[0]:
                  raise SystemExit("jas_si_runtime regained direct tenant-table/column access")

              cur.execute("""
                  SELECT count(*),
                         pg_catalog.bool_and(p.prosecdef),
                         pg_catalog.bool_and(NOT r.rolcanlogin AND NOT r.rolsuper
                           AND NOT r.rolcreatedb AND NOT r.rolcreaterole
                           AND NOT r.rolreplication AND NOT r.rolbypassrls
                           AND NOT r.rolinherit),
                         pg_catalog.bool_and('search_path=pg_catalog'=ANY(p.proconfig)),
                         pg_catalog.bool_and(NOT EXISTS (
                           SELECT 1
                             FROM pg_catalog.aclexplode(
                               COALESCE(p.proacl, pg_catalog.acldefault('f',p.proowner))
                             ) acl
                            WHERE acl.grantee=0 AND acl.privilege_type='EXECUTE'
                         ))
                    FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace
                    JOIN pg_catalog.pg_roles r ON r.oid=p.proowner
                   WHERE n.nspname='public'
                     AND (p.proname LIKE 'customer_%'
                       OR p.proname LIKE 'jas_si_api_key_%'
                       OR p.proname='jas_si_api_rate_limit_check')
              """)
              count, secure_definer, safe_owner, fixed_path, no_public = cur.fetchone()
              if not count or not all((secure_definer, safe_owner, fixed_path, no_public)):
                  raise SystemExit(
                      "Customer/API-key/usage routine security assertion failed: "
                      f"count={count}, security_definer={secure_definer}, "
                      f"safe_owner={safe_owner}, fixed_path={fixed_path}, "
                      f"no_public_execute={no_public}"
                  )
              print(f"Verified {count} SECURITY DEFINER routines and runtime usage-table isolation")

              # Exercise the worker failure transition as an actual LOGIN member
              # of the worker capability role. Security/configuration failures
              # must be terminal; a transient model timeout remains retryable.
              from uuid import uuid4
              tenant_id, key_id = uuid4(), uuid4()
              worker_id = uuid4()
              cur.execute(
                  "INSERT INTO public.jas_si_tenants(tenant_id,tenant_name) VALUES (%s,%s)",
                  (tenant_id, f"worker-retry-test-{tenant_id.hex}"),
              )
              cur.execute(
                  """INSERT INTO public.jas_si_api_keys(
                       key_id,tenant_id,key_name,key_prefix,secret_digest,
                       pepper_version,scopes,created_by
                     ) VALUES (%s,%s,%s,%s,%s,1,%s,%s)""",
                  (key_id,tenant_id,"migration-test",
                   f"jassi_test_{key_id.hex}",bytes([7])*32,
                   ["agent:tasks:write"],"migration-replay"),
              )
              task_ids = {"ACTION_NOT_AUTHORIZED": uuid4(), "MODEL_TIMEOUT": uuid4()}
              for error_code, task_id in task_ids.items():
                  cur.execute(
                      """INSERT INTO public.jas_si_agent_tasks(
                           task_id,tenant_id,api_key_id,idempotency_key,request_hash,
                           task_type,status,input_payload,attempt_count,max_attempts,
                           lease_owner,lease_expires_at,lease_fence
                         ) VALUES (%s,%s,%s,%s,%s,'reasoning','running','{}'::jsonb,
                                   1,3,%s,clock_timestamp()+interval '2 minutes',1)""",
                      (task_id,tenant_id,key_id,f"retry-{error_code}",
                       bytes([len(error_code)])*32,str(worker_id)),
                  )

              cur.execute("CREATE ROLE jas_si_agent_worker_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT")
              cur.execute("GRANT jas_si_agent_worker TO jas_si_agent_worker_test")
              cur.execute("SET SESSION AUTHORIZATION jas_si_agent_worker_test")
              # The capability role is deliberately NOINHERIT; the worker
              # process must explicitly SET ROLE to its narrowly granted API.
              cur.execute("SET ROLE jas_si_agent_worker")
              for error_code, task_id in task_ids.items():
                  cur.execute(
                      "SELECT public.jas_si_agent_task_fail(%s,%s,1,%s,0)",
                      (worker_id,task_id,error_code),
                  )
                  expected = "failed" if error_code == "ACTION_NOT_AUTHORIZED" else "queued"
                  actual = cur.fetchone()[0]
                  if actual != expected:
                      raise SystemExit(
                          f"Worker failure transition mismatch for {error_code}: "
                          f"expected {expected}, got {actual}"
                      )
              cur.execute("RESET SESSION AUTHORIZATION")
              print("Verified worker LOGIN capability: deterministic denial is terminal; transient failure retries")

              # Verify the application audit writer works through its SECURITY
              # DEFINER routine while direct audit-table mutation remains denied.
              cur.execute(
                  "CREATE ROLE jas_si_agent_runtime_test LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT"
              )
              cur.execute(
                  "GRANT jas_si_runtime TO jas_si_agent_runtime_test "
                  "WITH ADMIN FALSE, INHERIT FALSE, SET TRUE"
              )
              conn.commit()
              from jas_si_agent.postgres_security_event_store import PostgresSecurityEventStore
              with psycopg.connect(dsn) as runtime_conn:
                  with runtime_conn.cursor() as runtime_cur:
                      runtime_cur.execute("SET SESSION AUTHORIZATION jas_si_agent_runtime_test")
                      runtime_cur.execute("SET ROLE jas_si_runtime")
                  PostgresSecurityEventStore.append_in_transaction(
                      runtime_conn,
                      {"event_type":"migration_replay_runtime_audit_writer","verified":True},
                  )
                  audit_result = PostgresSecurityEventStore.verify_integrity_in_transaction(runtime_conn)
                  if audit_result.get("valid") is not True:
                      raise SystemExit(f"Runtime audit writer produced an invalid chain: {audit_result!r}")
                  with runtime_conn.cursor() as runtime_cur:
                      runtime_cur.execute("SAVEPOINT direct_audit_write_guard")
                      try:
                          runtime_cur.execute(
                              """INSERT INTO public.jas_si_audit_events(
                                   event_payload,previous_hash,event_hash
                                 ) VALUES ('{}'::jsonb,%s,%s)""",
                              ("0"*64,"1"*64),
                          )
                      except psycopg.Error as exc:
                          if exc.sqlstate != "42501":
                              raise
                          runtime_cur.execute("ROLLBACK TO SAVEPOINT direct_audit_write_guard")
                      else:
                          raise SystemExit("Runtime role retained direct audit-table INSERT")
                      runtime_cur.execute("RELEASE SAVEPOINT direct_audit_write_guard")
                      runtime_cur.execute("RESET SESSION AUTHORIZATION")
              print("Verified runtime audit writer routine and denied direct audit-table INSERT")

              # Customer email throttling also crosses a database-owned
              # SECURITY DEFINER boundary; the runtime role cannot touch rows.
              cur.execute(
                  "CREATE ROLE jas_si_customer_runtime_test LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT"
              )
              cur.execute(
                  "GRANT jas_si_customer_runtime TO jas_si_customer_runtime_test "
                  "WITH ADMIN FALSE, INHERIT FALSE, SET TRUE"
              )
              conn.commit()
              rate_bucket = bytes([11])*32
              with psycopg.connect(dsn) as customer_conn:
                  with customer_conn.cursor() as customer_cur:
                      customer_cur.execute("SET SESSION AUTHORIZATION jas_si_customer_runtime_test")
                      customer_cur.execute("SET ROLE jas_si_customer_runtime")
                      customer_cur.execute(
                          """SELECT allowed,retry_after_seconds
                               FROM public.jas_si_customer_rate_limit_check(%s,1,60)""",
                          (rate_bucket,),
                      )
                      first_rate = customer_cur.fetchone()
                      customer_cur.execute(
                          """SELECT allowed,retry_after_seconds
                               FROM public.jas_si_customer_rate_limit_check(%s,1,60)""",
                          (rate_bucket,),
                      )
                      second_rate = customer_cur.fetchone()
                      if first_rate is None or first_rate[0] is not True:
                          raise SystemExit(f"First customer rate-limit request was not allowed: {first_rate!r}")
                      if second_rate is None or second_rate[0] is not False:
                          raise SystemExit(f"Customer rate-limit threshold was not enforced: {second_rate!r}")
                      customer_cur.execute("SAVEPOINT direct_rate_limit_write_guard")
                      try:
                          customer_cur.execute(
                              """INSERT INTO public.jas_si_customer_rate_limits(
                                   bucket_key,window_started_at,request_count
                                 ) VALUES (%s,clock_timestamp(),1)""",
                              (bytes([12])*32,),
                          )
                      except psycopg.Error as exc:
                          if exc.sqlstate != "42501":
                              raise
                          customer_cur.execute("ROLLBACK TO SAVEPOINT direct_rate_limit_write_guard")
                      else:
                          raise SystemExit("Customer runtime retained direct rate-limit table INSERT")
                      customer_cur.execute("RELEASE SAVEPOINT direct_rate_limit_write_guard")
                      customer_cur.execute("RESET SESSION AUTHORIZATION")
              print("Verified database-owned customer rate limiting and denied direct table INSERT")
              # Exercise the customer-review routine through the runtime role.
              # The caller receives no direct task or audit-table privileges.
              from uuid import uuid4
              review_task_id, review_reviewer_id = uuid4(), uuid4()
              cur.execute(
                  """INSERT INTO public.jas_si_agent_tasks(
                       task_id,tenant_id,api_key_id,idempotency_key,request_hash,
                       task_type,status,input_payload,verifier_attempt_count,
                       verifier_last_status,verifier_last_reason
                     ) VALUES (%s,%s,%s,%s,%s,'github.read_repository',
                               'human_review_required','{}'::jsonb,3,
                               'INCONCLUSIVE','EVIDENCE_MISSING')""",
                  (review_task_id,tenant_id,key_id,"review-close",
                   bytes([9])*32),
              )
              review_task_more_id = uuid4()
              cur.execute(
                  """INSERT INTO public.jas_si_agent_tasks(
                       task_id,tenant_id,api_key_id,idempotency_key,request_hash,
                       task_type,status,input_payload,verifier_attempt_count,
                       verifier_last_status,verifier_last_reason
                     ) VALUES (%s,%s,%s,%s,%s,'github.read_repository',
                               'human_review_required','{}'::jsonb,3,
                               'INCONCLUSIVE','EVIDENCE_MISSING')""",
                  (review_task_more_id,tenant_id,key_id,"review-more",
                   bytes([10])*32),
              )
              cur.execute("SET SESSION AUTHORIZATION jas_si_agent_runtime_test")
              cur.execute("SET ROLE jas_si_runtime")

              close_args = (
                  review_task_id,tenant_id,review_reviewer_id,
                  "close_unverified","OWNER_CONFIRMED","review-close-001",
              )
              cur.execute(
                  """SELECT decision_event_id,task_status,created,decided_at
                       FROM public.jas_si_agent_task_human_review_decide(
                         %s,%s,%s,%s,%s,%s)""",
                  close_args,
              )
              close_first = cur.fetchone()
              if close_first is None or close_first[1] != "closed_unverified" or close_first[2] is not True:
                  raise SystemExit(f"Human review close transition failed: {close_first!r}")

              cur.execute(
                  """SELECT decision_event_id,task_status,created,decided_at
                       FROM public.jas_si_agent_task_human_review_decide(
                         %s,%s,%s,%s,%s,%s)""",
                  close_args,
              )
              close_replay = cur.fetchone()
              if close_replay is None or close_replay[0] != close_first[0] or close_replay[2] is not False:
                  raise SystemExit(f"Human review idempotent replay failed: {close_replay!r}")

              cur.execute("SAVEPOINT review_conflicting_replay")
              try:
                  cur.execute(
                      """SELECT * FROM public.jas_si_agent_task_human_review_decide(
                           %s,%s,%s,%s,%s,%s)""",
                      (
                          review_task_id,tenant_id,review_reviewer_id,
                          "request_more_evidence","NEED_MORE_EVIDENCE","review-close-001",
                      ),
                  )
              except psycopg.Error as exc:
                  if exc.sqlstate != "22023":
                      raise
                  cur.execute("ROLLBACK TO SAVEPOINT review_conflicting_replay")
              else:
                  raise SystemExit("Conflicting review idempotency replay was accepted")
              cur.execute("RELEASE SAVEPOINT review_conflicting_replay")

              # Cross-tenant task IDs must resolve to no record, not disclose state.
              cur.execute(
                  """SELECT * FROM public.jas_si_agent_task_human_review_decide(
                       %s,%s,%s,%s,%s,%s)""",
                  (
                      review_task_id,uuid4(),review_reviewer_id,
                      "close_unverified","OWNER_CONFIRMED","review-cross-tenant",
                  ),
              )
              if cur.fetchone() is not None:
                  raise SystemExit("Cross-tenant human review task was disclosed")

              more_args = (
                  review_task_more_id,tenant_id,review_reviewer_id,
                  "request_more_evidence","NEED_MORE_EVIDENCE","review-more-001",
              )
              cur.execute(
                  """SELECT decision_event_id,task_status,created,decided_at
                       FROM public.jas_si_agent_task_human_review_decide(
                         %s,%s,%s,%s,%s,%s)""",
                  more_args,
              )
              more_result = cur.fetchone()
              if more_result is None or more_result[1] != "human_review_required" or more_result[2] is not True:
                  raise SystemExit(f"Request-more-evidence transition failed: {more_result!r}")
              cur.execute(
                  """SELECT decision_event_id,task_status,created,decided_at
                       FROM public.jas_si_agent_task_human_review_decide(
                         %s,%s,%s,%s,%s,%s)""",
                  more_args,
              )
              more_replay = cur.fetchone()
              if more_replay is None or more_replay[0] != more_result[0] or more_replay[2] is not False:
                  raise SystemExit(f"Request-more-evidence idempotent replay failed: {more_replay!r}")

              cur.execute(
                  """SELECT task_id,task_status,verification_status,verification_reason_code
                       FROM public.jas_si_agent_task_human_review_queue(%s,%s)""",
                  (tenant_id,10),
              )
              queue_rows = cur.fetchall()
              if len(queue_rows) != 1 or queue_rows[0][0] != review_task_more_id:
                  raise SystemExit(f"Tenant review queue returned wrong tasks: {queue_rows!r}")

              cur.execute(
                  """SELECT task_exists,decision_event_id,decision,reason_code,
                            previous_status,resulting_status
                       FROM public.jas_si_agent_task_human_review_history(%s,%s,%s)""",
                  (tenant_id,review_task_id,10),
              )
              history_rows = cur.fetchall()
              if (
                  len(history_rows) != 1
                  or history_rows[0][0] is not True
                  or history_rows[0][2] != "close_unverified"
                  or history_rows[0][5] != "closed_unverified"
              ):
                  raise SystemExit(f"Tenant review history returned wrong events: {history_rows!r}")

              cur.execute(
                  """SELECT * FROM public.jas_si_agent_task_human_review_history(%s,%s,%s)""",
                  (uuid4(),review_task_id,10),
              )
              if cur.fetchall():
                  raise SystemExit("Cross-tenant review history disclosed task events")

              cur.execute("RESET SESSION AUTHORIZATION")
              cur.execute(
                  "SELECT status,completed_at FROM public.jas_si_agent_tasks WHERE task_id=%s",
                  (review_task_id,),
              )
              closed_task = cur.fetchone()
              if closed_task is None or closed_task[0] != "closed_unverified" or closed_task[1] is None:
                  raise SystemExit(f"Closed review task is not a terminal unverified state: {closed_task!r}")
              cur.execute(
                  "SELECT count(*) FROM public.jas_si_agent_task_review_events WHERE task_id IN (%s,%s)",
                  (review_task_id,review_task_more_id),
              )
              review_event_count = cur.fetchone()[0]
              if review_event_count != 2:
                  raise SystemExit(f"Expected two immutable review events, found {review_event_count}")

              # Even the isolated audit-table owner cannot mutate review events;
              # UPDATE and TRUNCATE triggers must reject changes.
              cur.execute("SET ROLE jas_si_agent_review_audit_owner")
              cur.execute("SAVEPOINT review_audit_update_guard")
              try:
                  cur.execute(
                      """UPDATE public.jas_si_agent_task_review_events
                            SET reason_code='TAMPERED'
                          WHERE task_id=%s""",
                      (review_task_id,),
                  )
              except psycopg.Error as exc:
                  if exc.sqlstate != "55000":
                      raise
                  cur.execute("ROLLBACK TO SAVEPOINT review_audit_update_guard")
              else:
                  raise SystemExit("Append-only review audit accepted UPDATE")
              cur.execute("RELEASE SAVEPOINT review_audit_update_guard")

              cur.execute("SAVEPOINT review_audit_truncate_guard")
              try:
                  cur.execute("TRUNCATE public.jas_si_agent_task_review_events")
              except psycopg.Error as exc:
                  # The evidence-request FK also prevents truncating the
                  # referenced append-only review log (0A000) before its
                  # explicit immutability trigger can run (55000).
                  if exc.sqlstate not in {"55000","0A000"}:
                      raise
                  cur.execute("ROLLBACK TO SAVEPOINT review_audit_truncate_guard")
              else:
                  raise SystemExit("Append-only review audit accepted TRUNCATE")
              cur.execute("RELEASE SAVEPOINT review_audit_truncate_guard")
              cur.execute("RESET ROLE")

              cur.execute(
                  """SELECT count(*),bool_and(reason_code<>'TAMPERED')
                       FROM public.jas_si_agent_task_review_events
                      WHERE task_id IN (%s,%s)""",
                  (review_task_id,review_task_more_id),
              )
              immutable_audit = cur.fetchone()
              if immutable_audit != (2, True):
                  raise SystemExit(f"Human review audit was mutated: {immutable_audit!r}")

              # A request-more-evidence decision must enqueue exactly one
              # evidence-only request, without creating/requeueing Worker work.
              cur.execute(
                  """SELECT count(*),bool_and(task_id=%s),bool_and(tenant_id=%s),
                            bool_and(review_event_id=%s)
                       FROM public.jas_si_agent_evidence_requests
                      WHERE task_id=%s""",
                  (review_task_more_id,tenant_id,more_result[0],review_task_more_id),
              )
              evidence_queue = cur.fetchone()
              if evidence_queue != (1,True,True,True):
                  raise SystemExit(f"Evidence request was not atomically and uniquely enqueued: {evidence_queue!r}")

              # The request is bound to the immutable persisted GitHub read scope.
              commit_sha = "a" * 40
              tree_sha = "b" * 40
              blob_sha = "c" * 40
              file_sha256 = "d" * 64
              input_payload = {
                  "repository":"owner/project",
                  "commit_sha":commit_sha,
                  "paths":["README.md"],
              }
              report_payload = {
                  "task_type":"github.read_repository",
                  "repository":"owner/project",
                  "commit_sha":commit_sha,
                  "evidence_integrity":{
                      "status":"EVIDENCE_INTEGRITY_VERIFIED",
                      "verification_scope":"github_commit_and_file_integrity",
                      "repository":"owner/project",
                      "commit_sha":commit_sha,
                      "tree_sha":tree_sha,
                      "files_verified":1,
                      "read_only":True,
                      "semantic_truth_verified":False,
                      "files":[{
                          "path":"README.md","integrity":"VERIFIED",
                          "blob_sha":blob_sha,"sha256":file_sha256,"size_bytes":5,
                      }],
                  },
              }
              cur.execute(
                  """UPDATE public.jas_si_agent_tasks
                        SET input_payload=%s::jsonb,result_payload=%s::jsonb,
                            reported_at=clock_timestamp()
                      WHERE task_id=%s AND tenant_id=%s
                        AND status='human_review_required'""",
                  (json.dumps(input_payload),json.dumps(report_payload),
                   review_task_more_id,tenant_id),
              )

              # Worker capability must not claim evidence-only requests.
              cur.execute("SAVEPOINT worker_evidence_claim_denied")
              cur.execute("SET SESSION AUTHORIZATION jas_si_agent_worker_test")
              cur.execute("SET ROLE jas_si_agent_worker")
              try:
                  cur.execute("SELECT * FROM public.jas_si_agent_evidence_request_claim(1,30)")
              except psycopg.Error as exc:
                  if exc.sqlstate != "42501":
                      raise
                  cur.execute("ROLLBACK TO SAVEPOINT worker_evidence_claim_denied")
              else:
                  raise SystemExit("Worker role unexpectedly claimed evidence-only work")
              cur.execute("RESET SESSION AUTHORIZATION")
              cur.execute("RELEASE SAVEPOINT worker_evidence_claim_denied")

              # Only the dedicated verifier capability can claim this request.
              cur.execute(
                  "CREATE ROLE jas_si_agent_verifier_test LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT"
              )
              cur.execute(
                  "GRANT jas_si_agent_verifier TO jas_si_agent_verifier_test "
                  "WITH ADMIN FALSE, INHERIT FALSE, SET TRUE"
              )
              cur.execute("SET SESSION AUTHORIZATION jas_si_agent_verifier_test")
              cur.execute("SET ROLE jas_si_agent_verifier")
              cur.execute("SELECT request_id,task_id,tenant_id,task_type,claim_token FROM public.jas_si_agent_evidence_request_claim(1,30)")
              claimed_evidence = cur.fetchone()
              if claimed_evidence is None or claimed_evidence[0] is None or claimed_evidence[1] != review_task_more_id or claimed_evidence[2] != tenant_id or claimed_evidence[3] != "github.read_repository" or claimed_evidence[4] is None:
                  raise SystemExit(f"Verifier failed to claim evidence-only request: {claimed_evidence!r}")
              cur.execute("SAVEPOINT verifier_direct_evidence_table_denied")
              try:
                  cur.execute("SELECT * FROM public.jas_si_agent_evidence_requests")
              except psycopg.Error as exc:
                  if exc.sqlstate != "42501":
                      raise
                  cur.execute("ROLLBACK TO SAVEPOINT verifier_direct_evidence_table_denied")
              else:
                  raise SystemExit("Verifier capability retained direct evidence-request table access")
              cur.execute("RELEASE SAVEPOINT verifier_direct_evidence_table_denied")

              # Exercise the fenced success path with a digest over fresh,
              # independently collected repository/commit/file evidence.
              collected_at = datetime.now(timezone.utc)
              evidence_digest = hashlib.sha256(
                  "|".join([
                      "owner/project",commit_sha,tree_sha,
                      f"README.md:{blob_sha}:{file_sha256}",
                  ]).encode("utf-8")
              ).digest()
              evidence_payload = {
                  "task_id":str(review_task_more_id),
                  "tenant_id":str(tenant_id),
                  "collector_id":"replay-verifier",
                  "verification_status":"VERIFIED_SUCCESS",
                  "repository":"owner/project",
                  "commit_sha":commit_sha,
                  "tree_sha":tree_sha,
                  "files":[{
                      "path":"README.md","integrity":"VERIFIED",
                      "blob_sha":blob_sha,"sha256":file_sha256,"size_bytes":5,
                  }],
                  "evidence_digest":evidence_digest.hex(),
                  "collected_at":collected_at.isoformat(),
                  "verification_reason":"INDEPENDENT_GITHUB_COMMIT_AND_FILE_INTEGRITY_VERIFIED",
              }
              cur.execute(
                  """SELECT public.jas_si_agent_evidence_request_finalize_success(
                       %s,%s,%s,%s,%s,%s,%s,%s::jsonb,%s)""",
                  (
                      claimed_evidence[0],review_task_more_id,tenant_id,
                      claimed_evidence[4],uuid4(),"replay-verifier",
                      evidence_digest,json.dumps(evidence_payload),collected_at,
                  ),
              )
              if cur.fetchone()[0] is not True:
                  raise SystemExit("Fenced evidence-only success finalization failed")
              cur.execute("RESET SESSION AUTHORIZATION")
              cur.execute(
                  """SELECT q.status,r.status,e.verification_status
                       FROM public.jas_si_agent_tasks q
                       JOIN public.jas_si_agent_evidence_requests r
                         ON r.task_id=q.task_id AND r.tenant_id=q.tenant_id
                       JOIN public.jas_si_agent_evidence_records e
                         ON e.task_id=q.task_id AND e.tenant_id=q.tenant_id
                      WHERE q.task_id=%s AND r.request_id=%s""",
                  (review_task_more_id,claimed_evidence[0]),
              )
              finalized_state = cur.fetchone()
              if finalized_state != ("succeeded","completed","VERIFIED_SUCCESS"):
                  raise SystemExit(f"Evidence-only finalization state mismatch: {finalized_state!r}")
              print("Verified Human Review runtime boundary: tenant isolation, atomic disposition, idempotency and immutable audit")
              print("Verified evidence-only lifecycle: atomic/idempotent enqueue, worker denial, verifier-only claim, no direct table access and fenced independent success finalization")
          PY