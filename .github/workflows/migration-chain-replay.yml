name: JAS-SI Clean Migration Chain Replay

on:
  workflow_dispatch:
  push:
    branches:
      - feat/tenant-github-installation-binding-v1
      - feat/github-webhook-durable-inbox-v1
      - feat/github-webhook-http-ingress-v1
      - feat/github-installation-user-ownership-proof-v1
      - feat/github-oauth-state-pkce-contract-v1
      - feat/agent-task-db-principal-binding-v1
    paths:
      - "src/jas_si_agent/migrations/**"
      - ".github/workflows/migration-chain-replay.yml"
      - "tests/test_github_webhook_inbox_postgres_integration.py"
      - "tests/test_github_oauth_attempt_postgres_integration.py"
      - "tests/test_github_installation_reconciliation_postgres_integration.py"
  pull_request:
    branches:
      - feat/github-webhook-http-ingress-v1
      - main
      - feat/customer-identity-onboarding-v1
      - fix/tenant-suspension-locking-after-onboarding-fix
      - feat/durable-agent-task-store-v1
      - feat/verifier-inconclusive-review-lifecycle-rebased
      - feat/github-app-token-issuer-v1
      - feat/github-installation-onboarding-security-v1
      - feat/github-webhook-durable-inbox-v1
      - feat/github-installation-user-ownership-proof-v1
      - feat/github-oauth-state-pkce-contract-v1
      - feat/agent-task-db-principal-binding-v1
      - feat/github-capability-workload-identity-v1
    paths:
      - "src/jas_si_agent/migrations/**"
      - ".github/workflows/migration-chain-replay.yml"
      - "tests/test_customer_identity_postgres_integration.py"
      - "tests/test_github_webhook_inbox_postgres_integration.py"
      - "tests/test_github_oauth_attempt_postgres_integration.py"
      - "tests/test_github_installation_reconciliation_postgres_integration.py"

permissions:
  contents: read

concurrency:
  group: jas-si-migration-chain-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-postgres-replay:
    name: PostgreSQL ${{ matrix.postgres-version }} clean replay and idempotency
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [16, 18]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: jas_si_migration_replay
          POSTGRES_USER: jas_si
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jas_si -d jas_si_migration_replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JAS_SI_MIGRATION_REPLAY_DATABASE_URL: postgresql://jas_si:test-only-password@localhost:5432/jas_si_migration_replay
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock.txt
      - name: Replay every migration twice on a clean database
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          import sys
          import psycopg

          root = Path.cwd()
          sys.path.insert(0, str(root / "src"))
          migration_dir = root / "src" / "jas_si_agent" / "migrations"
          migrations = (
              "001_create_audit_tables.sql",
              "002_create_tenant_api_keys.sql",
              "003_atomic_api_key_provisioning.sql",
              "004_audit_event_id_identity.sql",
              "005_provisioner_tenant_row_lock.sql",
              "006_api_key_registry_role_grants.sql",
              "007_customer_api_key_self_service.sql",
              "20261110_customer_identity.sql",
              "20261112_customer_identity_routines.sql",
              "20261113_customer_api_key_routines.sql",
              "20261110_customer_rate_limits.sql",
              "20261110_usage_metering.sql",
              "20261110_usage_idempotency_fingerprint.sql",
              "20261111_usage_append_only_role_grants.sql",
              "20261114_customer_usage_read_routines.sql",
              "20261115_api_key_auth_boundary.sql",
              "20261116_api_key_bound_usage_routines.sql",
              "20261117_runtime_usage_routine_only.sql",
              "20261118_shared_api_rate_limits.sql",
          )
          # These security and agent migrations are required for this branch's
          # complete schema chain. Missing files must fail replay rather than
          # silently reducing the migration set being tested.
          required_acl_migrations = (
              "20261119_general_runtime_customer_identity_acl.sql",
              "20261120_api_key_auth_runtime_tenant_acl.sql",
              "20261115z_api_key_auth_tenant_lock_reassert.sql",
              "20261121_security_audit_writer_boundary.sql",
              "20261122_customer_rate_limit_owner_boundary.sql",
              "20261123_agent_task_store.sql",
              "20261123_agent_task_scope_allowlist.sql",
              "20261124_agent_task_worker_lifecycle.sql",
              "20261125_agent_task_usage_scope.sql",
              "20261126_agent_task_nonretryable_failures.sql",
              "20261127_agent_task_evidence_finalization.sql",
              "20261128_agent_task_verifier_claims.sql",
              "20261129_agent_runtime_default_acl_boundary.sql",
              "20261130_customer_tenant_active_guard_reassert.sql",
              "20261130a_general_runtime_default_acl_boundary.sql",
              "20261201_agent_task_verifier_inconclusive_lifecycle.sql",
              "20261201_github_installation_binding.sql",
              "20261202_github_webhook_inbox.sql",
              "20261203_api_key_provisioner_rls_policies.sql",
              "20261204_github_oauth_attempt_store.sql",
              "20261206_github_installation_claims.sql",
              "20261207_github_installation_reconciliation.sql",
              "20261208_github_webhook_login_boundary.sql",
              "20261209_github_reconciler_login_boundary.sql",
              "20261210_github_login_hyphen_boundary.sql",
              "20261211_github_reconcile_tenant_row_lock.sql",
              "20261212_github_reconcile_tenant_row_lock_rls.sql",
              "20261213_agent_task_db_principal_binding.sql",
          )
          missing_acl_migrations = [
              name for name in required_acl_migrations
              if not migration_dir.joinpath(name).is_file()
          ]
          if missing_acl_migrations:
              raise SystemExit(
                  "Missing required security/agent migrations: "
                  + ", ".join(missing_acl_migrations)
              )
          migrations = migrations + required_acl_migrations

          dsn = os.environ["JAS_SI_MIGRATION_REPLAY_DATABASE_URL"]
          with psycopg.connect(dsn) as conn, conn.cursor() as cur:
              for role in (
                  "jas_si_runtime", "jas_si_provisioner", "jas_si_customer_runtime",
                  "neondb_owner", "jas_si_agent_worker_login",
                  "jas_si_agent_verifier_login",
              ):
                  cur.execute("SELECT 1 FROM pg_catalog.pg_roles WHERE rolname=%s", (role,))
                  if cur.fetchone() is None:
                      # Production's broad runtime identity is a LOGIN role;
                      # mirror that contract in clean replay without using it
                      # as an application service DSN.
                      login_clause = (
                          "LOGIN PASSWORD 'test-only-runtime-password'"
                          if role == "jas_si_runtime" else "NOLOGIN"
                      )
                      cur.execute(
                          f'CREATE ROLE "{role}" {login_clause} NOSUPERUSER NOCREATEDB '
                          "NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT"
                      )

              # Seed the known-bad future-object grants so the ACL boundary
              # migration proves it removes them on every clean replay.
              cur.execute(
                  "ALTER DEFAULT PRIVILEGES FOR ROLE neondb_owner IN SCHEMA public "
                  "GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO jas_si_agent_worker_login"
              )
              cur.execute(
                  "ALTER DEFAULT PRIVILEGES FOR ROLE neondb_owner IN SCHEMA public "
                  "GRANT SELECT, USAGE, UPDATE ON SEQUENCES TO jas_si_agent_worker_login"
              )
              cur.execute(
                  "ALTER DEFAULT PRIVILEGES FOR ROLE neondb_owner IN SCHEMA public "
                  "GRANT SELECT ON TABLES TO jas_si_agent_verifier_login"
              )
              cur.execute(
                  "ALTER DEFAULT PRIVILEGES FOR ROLE neondb_owner IN SCHEMA public "
                  "GRANT SELECT ON SEQUENCES TO jas_si_agent_verifier_login"
              )

              for replay in (1, 2):
                  for name in migrations:
                      path = migration_dir / name
                      if not path.is_file():
                          raise SystemExit(f"Missing migration in canonical replay order: {name}")
                      migration_sql = path.read_text(encoding="utf-8")
                      # Split only on semicolons outside quoted strings, comments,
                      # identifiers, and PostgreSQL dollar-quoted function/DO bodies.
                      statements = []
                      start = 0
                      i = 0
                      quote = None
                      dollar_tag = None
                      line_comment = False
                      block_depth = 0
                      while i < len(migration_sql):
                          if line_comment:
                              if migration_sql[i] == "\n":
                                  line_comment = False
                              i += 1
                              continue
                          if block_depth:
                              if migration_sql.startswith("/*", i):
                                  block_depth += 1
                                  i += 2
                              elif migration_sql.startswith("*/", i):
                                  block_depth -= 1
                                  i += 2
                              else:
                                  i += 1
                              continue
                          if dollar_tag is not None:
                              if migration_sql.startswith(dollar_tag, i):
                                  i += len(dollar_tag)
                                  dollar_tag = None
                              else:
                                  i += 1
                              continue
                          if quote == "'":
                              if migration_sql[i] == "'" and i+1 < len(migration_sql) and migration_sql[i+1] == "'":
                                  i += 2
                              elif migration_sql[i] == "'":
                                  quote = None
                                  i += 1
                              else:
                                  i += 1
                              continue
                          if quote == '"':
                              if migration_sql[i] == '"' and i+1 < len(migration_sql) and migration_sql[i+1] == '"':
                                  i += 2
                              elif migration_sql[i] == '"':
                                  quote = None
                                  i += 1
                              else:
                                  i += 1
                              continue
                          if migration_sql.startswith("--", i):
                              line_comment = True
                              i += 2
                          elif migration_sql.startswith("/*", i):
                              block_depth = 1
                              i += 2
                          elif migration_sql[i] in ("'", '"'):
                              quote = migration_sql[i]
                              i += 1
                          elif migration_sql[i] == "$":
                              match = re.match(r"\$[A-Za-z_0-9]*\$", migration_sql[i:])
                              if match:
                                  dollar_tag = match.group(0)
                                  i += len(dollar_tag)
                              else:
                                  i += 1
                          elif migration_sql[i] == ";":
                              statement = migration_sql[start:i+1].strip()
                              if statement:
                                  statements.append(statement)
                              start = i+1
                              i += 1
                          else:
                              i += 1
                      tail = migration_sql[start:].strip()
                      if tail:
                          statements.append(tail)
                      for statement_number, statement in enumerate(statements, start=1):
                          cur.execute("""
                              SELECT session_user,current_user,
                                     pg_catalog.has_schema_privilege(current_user,'public','USAGE'),
                                     pg_catalog.has_schema_privilege(current_user,'public','CREATE')
                          """)
                          session_user,current_user,has_usage,has_create = cur.fetchone()
                          try:
                              cur.execute(statement)
                          except psycopg.Error as exc:
                              print(
                                  f"Migration failed: {name}; statement={statement_number}/"
                                  f"{len(statements)}; SQLSTATE={exc.sqlstate}; "
                                  f"session_user={session_user}; current_user={current_user}; "
                                  f"public_usage={has_usage}; public_create={has_create}"
                              )
                              print("Failing SQL statement:\n" + statement[:4000])
                              conn.rollback()
                              raise
                  print(f"Migration pass {replay}: {len(migrations)} files applied")

              cur.execute("SELECT 1 FROM pg_catalog.pg_roles WHERE rolname='jas_si_github_reconciler_test'")
              if cur.fetchone() is None:
                  cur.execute("CREATE ROLE jas_si_github_reconciler_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT")
              cur.execute("GRANT jas_si_github_reconciler TO jas_si_github_reconciler_test")

              cur.execute("""
                  SELECT
                    pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','SELECT')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','INSERT')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','UPDATE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','DELETE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','TRUNCATE')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_usage_events','SELECT')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_usage_events','INSERT')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_usage_events','UPDATE')
              """)
              if cur.fetchone()[0]:
                  raise SystemExit("jas_si_runtime regained direct usage-event table/column access")

              cur.execute("""
                  SELECT
                    pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','SELECT')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','INSERT')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','UPDATE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','DELETE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','TRUNCATE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','REFERENCES')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','TRIGGER')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_tenants','SELECT')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_tenants','INSERT')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_tenants','UPDATE')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_tenants','REFERENCES')
              """)
              if cur.fetchone()[0]:
                  raise SystemExit("jas_si_runtime regained direct tenant-table/column access")

              cur.execute("""
                  SELECT count(*),
                         pg_catalog.bool_and(p.prosecdef),
                         pg_catalog.bool_and(NOT r.rolcanlogin AND NOT r.rolsuper
                           AND NOT r.rolcreatedb AND NOT r.rolcreaterole
                           AND NOT r.rolreplication AND NOT r.rolbypassrls
                           AND NOT r.rolinherit),
                         pg_catalog.bool_and('search_path=pg_catalog'=ANY(p.proconfig)),
                         pg_catalog.bool_and(NOT EXISTS (
                           SELECT 1
                             FROM pg_catalog.aclexplode(
                               COALESCE(p.proacl, pg_catalog.acldefault('f',p.proowner))
                             ) acl
                            WHERE acl.grantee=0 AND acl.privilege_type='EXECUTE'
                         ))
                    FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace
                    JOIN pg_catalog.pg_roles r ON r.oid=p.proowner
                   WHERE n.nspname='public'
                     AND (p.proname LIKE 'customer_%'
                       OR p.proname LIKE 'jas_si_api_key_%'
                       OR p.proname='jas_si_api_rate_limit_check')
              """)
              count, secure_definer, safe_owner, fixed_path, no_public = cur.fetchone()
              if not count or not all((secure_definer, safe_owner, fixed_path, no_public)):
                  raise SystemExit(
                      "Customer/API-key/usage routine security assertion failed: "
                      f"count={count}, security_definer={secure_definer}, "
                      f"safe_owner={safe_owner}, fixed_path={fixed_path}, "
                      f"no_public_execute={no_public}"
                  )
              print(f"Verified {count} SECURITY DEFINER routines and runtime usage-table isolation")

              # Exercise the worker failure transition as an actual LOGIN member
              # of the worker capability role. Security/configuration failures
              # must be terminal; a transient model timeout remains retryable.
              from uuid import uuid4
              tenant_id, key_id = uuid4(), uuid4()
              worker_id = uuid4()
              cur.execute(
                  "INSERT INTO public.jas_si_tenants(tenant_id,tenant_name) VALUES (%s,%s)",
                  (tenant_id, f"worker-retry-test-{tenant_id.hex}"),
              )
              cur.execute(
                  """INSERT INTO public.jas_si_api_keys(
                       key_id,tenant_id,key_name,key_prefix,secret_digest,
                       pepper_version,scopes,created_by
                     ) VALUES (%s,%s,%s,%s,%s,1,%s,%s)""",
                  (key_id,tenant_id,"migration-test",
                   f"jassi_test_{key_id.hex}",bytes([7])*32,
                   ["agent:tasks:write"],"migration-replay"),
              )
              task_ids = {"ACTION_NOT_AUTHORIZED": uuid4(), "MODEL_TIMEOUT": uuid4()}
              for error_code, task_id in task_ids.items():
                  cur.execute(
                      """INSERT INTO public.jas_si_agent_tasks(
                           task_id,tenant_id,api_key_id,idempotency_key,request_hash,
                           task_type,status,input_payload,attempt_count,max_attempts,
                           lease_owner,lease_expires_at,lease_fence,lease_owner_principal
                         ) VALUES (%s,%s,%s,%s,%s,'reasoning','running','{}'::jsonb,
                                   1,3,%s,clock_timestamp()+interval '2 minutes',1,'jas_si_agent_worker_test')""",
                      (task_id,tenant_id,key_id,f"retry-{error_code}",
                       bytes([len(error_code)])*32,str(worker_id)),
                  )

              cur.execute("CREATE ROLE jas_si_agent_worker_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT")
              cur.execute("GRANT jas_si_agent_worker TO jas_si_agent_worker_test")
              cur.execute("CREATE ROLE jas_si_agent_worker_other_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT")
              cur.execute("GRANT jas_si_agent_worker TO jas_si_agent_worker_other_test")
              expired_task_id = uuid4()
              cur.execute(
                  """INSERT INTO public.jas_si_agent_tasks(
                       task_id,tenant_id,api_key_id,idempotency_key,request_hash,
                       task_type,status,input_payload,attempt_count,max_attempts,
                       lease_owner,lease_expires_at,lease_fence,lease_owner_principal,
                       next_attempt_at
                     ) VALUES (%s,%s,%s,%s,%s,'reasoning','running','{}'::jsonb,
                               1,3,%s,clock_timestamp()-interval '1 second',7,
                               'jas_si_agent_worker_test',clock_timestamp()-interval '1 day')""",
                  (expired_task_id,tenant_id,key_id,f"expired-reclaim-{uuid4().hex}",
                   bytes([23])*32,str(worker_id)),
              )
              # Expired work is released and reclaimed by the next login;
              # the new lease must bind to that new authenticated principal.
              cur.execute("SET SESSION AUTHORIZATION jas_si_agent_worker_other_test")
              cur.execute("SET ROLE jas_si_agent_worker")
              cur.execute(
                  "SELECT task_id,lease_fence FROM public.jas_si_agent_task_claim(%s,60)",
                  (uuid4(),),
              )
              reclaimed = cur.fetchone()
              if reclaimed is None or reclaimed[0] != expired_task_id or reclaimed[1] != 8:
                  raise SystemExit(f"Expired lease was not safely reclaimed: {reclaimed!r}")
              cur.execute("RESET SESSION AUTHORIZATION")
              cur.execute(
                  "SELECT lease_owner_principal FROM public.jas_si_agent_tasks WHERE task_id=%s",
                  (expired_task_id,),
              )
              if cur.fetchone()[0] != "jas_si_agent_worker_other_test":
                  raise SystemExit("Reclaimed lease was not rebound to the new authenticated LOGIN")
              # A different authenticated LOGIN with the same capability role
              # must not renew/report/fail another login's lease.
              cur.execute("SET SESSION AUTHORIZATION jas_si_agent_worker_other_test")
              cur.execute("SET ROLE jas_si_agent_worker")
              cur.execute("SAVEPOINT foreign_worker_lease_guard")
              try:
                  cur.execute(
                      "SELECT public.jas_si_agent_task_fail(%s,%s,1,'FOREIGN_WORKER',0)",
                      (worker_id,next(iter(task_ids.values()))),
                  )
              except psycopg.Error as exc:
                  if exc.sqlstate != "42501":
                      raise
                  cur.execute("ROLLBACK TO SAVEPOINT foreign_worker_lease_guard")
              else:
                  raise SystemExit("A different worker LOGIN changed another principal's task lease")
              cur.execute("RELEASE SAVEPOINT foreign_worker_lease_guard")
              cur.execute("RESET SESSION AUTHORIZATION")
              # Legacy active leases created before this migration have no
              # authenticated principal. They must fail closed until expiry.
              legacy_worker_task_id = uuid4()
              legacy_worker_id = uuid4()
              cur.execute(
                  """INSERT INTO public.jas_si_agent_tasks(
                       task_id,tenant_id,api_key_id,idempotency_key,request_hash,
                       task_type,status,input_payload,attempt_count,max_attempts,
                       lease_owner,lease_expires_at,lease_fence,next_attempt_at
                     ) VALUES (%s,%s,%s,%s,%s,'reasoning','running','{}'::jsonb,
                               1,3,%s,clock_timestamp()+interval '2 minutes',4,
                               clock_timestamp()-interval '1 day')""",
                  (legacy_worker_task_id,tenant_id,key_id,
                   f"legacy-worker-{legacy_worker_task_id.hex}",bytes([31])*32,
                   str(legacy_worker_id)),
              )
              cur.execute("SET SESSION AUTHORIZATION jas_si_agent_worker_test")
              cur.execute("SET ROLE jas_si_agent_worker")
              cur.execute("SAVEPOINT legacy_worker_lease_guard")
              try:
                  cur.execute(
                      "SELECT public.jas_si_agent_task_fail(%s,%s,4,'LEGACY_LEASE',0)",
                      (legacy_worker_id,legacy_worker_task_id),
                  )
              except psycopg.Error as exc:
                  if exc.sqlstate != "42501":
                      raise
                  cur.execute("ROLLBACK TO SAVEPOINT legacy_worker_lease_guard")
              else:
                  raise SystemExit("An unbound legacy Worker lease was accepted before expiry")
              cur.execute("RELEASE SAVEPOINT legacy_worker_lease_guard")
              cur.execute("RESET SESSION AUTHORIZATION")
              cur.execute("SET SESSION AUTHORIZATION jas_si_agent_worker_test")
              # The capability role is deliberately NOINHERIT; the worker
              # process must explicitly SET ROLE to its narrowly granted API.
              cur.execute("SET ROLE jas_si_agent_worker")
              for error_code, task_id in task_ids.items():
                  cur.execute(
                      "SELECT public.jas_si_agent_task_fail(%s,%s,1,%s,0)",
                      (worker_id,task_id,error_code),
                  )
                  expected = "failed" if error_code == "ACTION_NOT_AUTHORIZED" else "queued"
                  actual = cur.fetchone()[0]
                  if actual != expected:
                      raise SystemExit(
                          f"Worker failure transition mismatch for {error_code}: "
                          f"expected {expected}, got {actual}"
                      )
              cur.execute("RESET SESSION AUTHORIZATION")
              print("Verified worker LOGIN capability: deterministic denial is terminal; transient failure retries")

              # Exercise tenant-scoped GitHub installation resolution with real
              # PostgreSQL roles, RLS, and separate tenant/repository fixtures.
              tenant_a, tenant_b = uuid4(), uuid4()
              installation_a, installation_b = 918349938, 918349939
              repository_a = "jas-si-test/tenant-a"
              repository_b = "jas-si-test/tenant-b"
              cur.execute(
                  "INSERT INTO public.jas_si_tenants(tenant_id,tenant_name) VALUES (%s,%s),(%s,%s)",
                  (tenant_a, f"github-binding-a-{tenant_a.hex}",
                   tenant_b, f"github-binding-b-{tenant_b.hex}"),
              )
              cur.execute("SET ROLE jas_si_agent_task_owner")
              cur.execute(
                  """INSERT INTO public.jas_si_github_app_installations(
                       installation_id,tenant_id,account_login,status,verified_at
                     ) VALUES
                       (%s,%s,'jas-si-test','active',clock_timestamp()),
                       (%s,%s,'jas-si-test','active',clock_timestamp())""",
                  (installation_a,tenant_a,installation_b,tenant_b),
              )
              cur.execute(
                  """INSERT INTO public.jas_si_github_app_installation_repositories(
                       installation_id,tenant_id,repository_full_name,status,verified_at
                     ) VALUES
                       (%s,%s,%s,'active',clock_timestamp()),
                       (%s,%s,%s,'active',clock_timestamp())""",
                  (installation_a,tenant_a,repository_a,
                   installation_b,tenant_b,repository_b),
              )
              cur.execute("RESET ROLE")
              cur.execute(
                  "CREATE ROLE jas_si_agent_verifier_test LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT"
              )
              cur.execute("GRANT jas_si_agent_verifier TO jas_si_agent_verifier_test")
              cur.execute(
                  "CREATE ROLE jas_si_agent_verifier_other_test LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT"
              )
              cur.execute("GRANT jas_si_agent_verifier TO jas_si_agent_verifier_other_test")
              verifier_task_id = uuid4()
              cur.execute(
                  """INSERT INTO public.jas_si_agent_tasks(
                       task_id,tenant_id,api_key_id,idempotency_key,request_hash,
                       task_type,status,input_payload,result_payload,attempt_count,max_attempts,
                       reported_at
                     ) VALUES (%s,%s,%s,%s,%s,'github.read_repository','awaiting_verification',
                               '{"repository":"jas-si-test/tenant-a","commit_sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","paths":["README.md"]}'::jsonb,
                               '{"claimed_success":true}'::jsonb,1,3,clock_timestamp())""",
                  (verifier_task_id,tenant_id,key_id,f"verifier-principal-{verifier_task_id.hex}",
                   bytes([19])*32),
              )
              conn.commit()

              # The verifier claim is owned by its authenticated LOGIN. A
              # second LOGIN with the same capability role cannot release it.
              with psycopg.connect(dsn) as verifier_conn:
                  with verifier_conn.cursor() as verifier_cur:
                      verifier_cur.execute("SET SESSION AUTHORIZATION jas_si_agent_verifier_test")
                      verifier_cur.execute("SET ROLE jas_si_agent_verifier")
                      verifier_cur.execute(
                          "SELECT task_id,tenant_id,verifier_claim_token "
                          "FROM public.jas_si_agent_task_verification_claim(1,120)"
                      )
                      verifier_claim = verifier_cur.fetchone()
                      if verifier_claim is None or verifier_claim[0] != verifier_task_id:
                          raise SystemExit(f"Verifier principal fixture was not claimed: {verifier_claim!r}")
                      verifier_task, verifier_tenant, verifier_token = verifier_claim
                      verifier_cur.execute("RESET SESSION AUTHORIZATION")
              with psycopg.connect(dsn) as verifier_conn:
                  with verifier_conn.cursor() as verifier_cur:
                      verifier_cur.execute("SET SESSION AUTHORIZATION jas_si_agent_verifier_other_test")
                      verifier_cur.execute("SET ROLE jas_si_agent_verifier")
                      verifier_cur.execute("SAVEPOINT foreign_verifier_claim_guard")
                      try:
                          verifier_cur.execute(
                              "SELECT public.jas_si_agent_task_verification_record_inconclusive(%s,%s,%s,'FOREIGN_VERIFIER')",
                              (verifier_task,verifier_tenant,verifier_token),
                          )
                      except psycopg.Error as exc:
                          if exc.sqlstate != "42501":
                              raise
                          verifier_cur.execute("ROLLBACK TO SAVEPOINT foreign_verifier_claim_guard")
                      else:
                          raise SystemExit("A different verifier LOGIN changed another principal's claim")
                      verifier_cur.execute("RELEASE SAVEPOINT foreign_verifier_claim_guard")
                      verifier_cur.execute("RESET SESSION AUTHORIZATION")
              with psycopg.connect(dsn) as verifier_conn:
                  with verifier_conn.cursor() as verifier_cur:
                      verifier_cur.execute("SET SESSION AUTHORIZATION jas_si_agent_verifier_test")
                      verifier_cur.execute("SET ROLE jas_si_agent_verifier")
                      verifier_cur.execute(
                          "SELECT public.jas_si_agent_task_verification_record_inconclusive(%s,%s,%s,'EXPECTED_INCONCLUSIVE')",
                          (verifier_task,verifier_tenant,verifier_token),
                      )
                      if verifier_cur.fetchone()[0] != "awaiting_verification":
                          raise SystemExit("Owning verifier LOGIN could not record its inconclusive outcome")
                      verifier_cur.execute("RESET SESSION AUTHORIZATION")

              # An expired verifier claim may be reclaimed by a different
              # authenticated LOGIN; the replacement claim must bind to it.
              expired_verifier_task_id = uuid4()
              expired_verifier_token = uuid4()
              with psycopg.connect(dsn) as host_conn:
                  with host_conn.cursor() as host_cur:
                      host_cur.execute(
                          """INSERT INTO public.jas_si_agent_tasks(
                               task_id,tenant_id,api_key_id,idempotency_key,request_hash,
                               task_type,status,input_payload,result_payload,attempt_count,max_attempts,
                               reported_at,verifier_claim_token,verifier_claimed_at,
                               verifier_lease_expires_at,verifier_attempt_count,
                               verifier_next_attempt_at,verifier_claim_owner
                             ) VALUES (%s,%s,%s,%s,%s,'github.read_repository','awaiting_verification',
                                       '{"repository":"jas-si-test/tenant-a","commit_sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","paths":["README.md"]}'::jsonb,
                                       '{"claimed_success":true}'::jsonb,1,3,
                                       clock_timestamp()-interval '1 day',%s,
                                       clock_timestamp()-interval '2 minutes',
                                       clock_timestamp()-interval '1 minute',1,
                                       clock_timestamp()-interval '1 day',
                                       'jas_si_agent_verifier_test')""",
                          (expired_verifier_task_id,tenant_id,key_id,
                           f"expired-verifier-{expired_verifier_task_id.hex}",
                           bytes([29])*32,expired_verifier_token),
                      )
                      host_conn.commit()
              with psycopg.connect(dsn) as verifier_conn:
                  with verifier_conn.cursor() as verifier_cur:
                      verifier_cur.execute("SET SESSION AUTHORIZATION jas_si_agent_verifier_other_test")
                      verifier_cur.execute("SET ROLE jas_si_agent_verifier")
                      verifier_cur.execute(
                          "SELECT task_id,verifier_claim_token FROM "
                          "public.jas_si_agent_task_verification_claim(1,120)"
                      )
                      reclaimed_verifier = verifier_cur.fetchone()
                      if reclaimed_verifier is None or reclaimed_verifier[0] != expired_verifier_task_id:
                          raise SystemExit(
                              f"Expired verifier claim was not reclaimed: {reclaimed_verifier!r}"
                          )
                      verifier_cur.execute("RESET SESSION AUTHORIZATION")
              with psycopg.connect(dsn) as host_conn:
                  with host_conn.cursor() as host_cur:
                      host_cur.execute(
                          "SELECT verifier_claim_owner FROM public.jas_si_agent_tasks WHERE task_id=%s",
                          (expired_verifier_task_id,),
                      )
                      if host_cur.fetchone()[0] != "jas_si_agent_verifier_other_test":
                          raise SystemExit(
                              "Reclaimed verifier claim was not rebound to the new authenticated LOGIN"
                          )
              print("Verified Worker lease and Verifier claim ownership against authenticated PostgreSQL LOGIN")


              for login_role, capability_role in (
                  ("jas_si_agent_worker_test","jas_si_agent_worker"),
                  ("jas_si_agent_verifier_test","jas_si_agent_verifier"),
              ):
                  with psycopg.connect(dsn) as host_conn:
                      with host_conn.cursor() as host_cur:
                          host_cur.execute(f"SET SESSION AUTHORIZATION {login_role}")
                          host_cur.execute(f"SET ROLE {capability_role}")
                          host_cur.execute(
                              """SELECT tenant_id,installation_id,repository_full_name
                                   FROM public.jas_si_github_installation_binding_resolve(%s,%s)""",
                              (tenant_a,repository_a),
                          )
                          own_binding = host_cur.fetchone()
                          if own_binding != (tenant_a,installation_a,repository_a):
                              raise SystemExit(
                                  f"{capability_role} could not resolve its tenant's active repository: {own_binding!r}"
                              )
                          host_cur.execute(
                              """SELECT tenant_id,installation_id,repository_full_name
                                   FROM public.jas_si_github_installation_binding_resolve(%s,%s)""",
                              (tenant_a,repository_b),
                          )
                          cross_tenant = host_cur.fetchone()
                          if cross_tenant is not None:
                              raise SystemExit(
                                  f"{capability_role} resolved another tenant's repository: {cross_tenant!r}"
                              )
                          host_cur.execute("SAVEPOINT direct_binding_read_guard")
                          try:
                              host_cur.execute(
                                  "SELECT installation_id FROM public.jas_si_github_app_installations"
                              )
                          except psycopg.Error as exc:
                              if exc.sqlstate != "42501":
                                  raise
                              host_cur.execute("ROLLBACK TO SAVEPOINT direct_binding_read_guard")
                          else:
                              raise SystemExit(
                                  f"{capability_role} retained direct installation-table SELECT"
                              )
                          host_cur.execute("RELEASE SAVEPOINT direct_binding_read_guard")
                          host_cur.execute("SAVEPOINT direct_tenant_read_guard")
                          try:
                              host_cur.execute("SELECT tenant_id FROM public.jas_si_tenants")
                          except psycopg.Error as exc:
                              if exc.sqlstate != "42501":
                                  raise
                              host_cur.execute("ROLLBACK TO SAVEPOINT direct_tenant_read_guard")
                          else:
                              raise SystemExit(
                                  f"{capability_role} retained direct tenant-table SELECT"
                              )
                          host_cur.execute("RELEASE SAVEPOINT direct_tenant_read_guard")
                          host_cur.execute("RESET SESSION AUTHORIZATION")
              print(
                  "Verified Worker and Verifier tenant binding: own repository resolves, "
                  "cross-tenant repository does not, and direct table reads are denied"
              )

              # Verify the application audit writer works through its SECURITY
              # DEFINER routine while direct audit-table mutation remains denied.
              cur.execute(
                  "CREATE ROLE jas_si_agent_runtime_test LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT"
              )
              cur.execute(
                  "GRANT jas_si_runtime TO jas_si_agent_runtime_test "
                  "WITH ADMIN FALSE, INHERIT FALSE, SET TRUE"
              )
              conn.commit()
              from jas_si_agent.postgres_security_event_store import PostgresSecurityEventStore
              with psycopg.connect(dsn) as runtime_conn:
                  with runtime_conn.cursor() as runtime_cur:
                      runtime_cur.execute("SET SESSION AUTHORIZATION jas_si_agent_runtime_test")
                      runtime_cur.execute("SET ROLE jas_si_runtime")
                  PostgresSecurityEventStore.append_in_transaction(
                      runtime_conn,
                      {"event_type":"migration_replay_runtime_audit_writer","verified":True},
                  )
                  audit_result = PostgresSecurityEventStore.verify_integrity_in_transaction(runtime_conn)
                  if audit_result.get("valid") is not True:
                      raise SystemExit(f"Runtime audit writer produced an invalid chain: {audit_result!r}")
                  with runtime_conn.cursor() as runtime_cur:
                      runtime_cur.execute("SAVEPOINT direct_audit_write_guard")
                      try:
                          runtime_cur.execute(
                              """INSERT INTO public.jas_si_audit_events(
                                   event_payload,previous_hash,event_hash
                                 ) VALUES ('{}'::jsonb,%s,%s)""",
                              ("0"*64,"1"*64),
                          )
                      except psycopg.Error as exc:
                          if exc.sqlstate != "42501":
                              raise
                          runtime_cur.execute("ROLLBACK TO SAVEPOINT direct_audit_write_guard")
                      else:
                          raise SystemExit("Runtime role retained direct audit-table INSERT")
                      runtime_cur.execute("RELEASE SAVEPOINT direct_audit_write_guard")
                      runtime_cur.execute("RESET SESSION AUTHORIZATION")
              print("Verified runtime audit writer routine and denied direct audit-table INSERT")

              # Customer email throttling also crosses a database-owned
              # SECURITY DEFINER boundary; the runtime role cannot touch rows.
              cur.execute(
                  "CREATE ROLE jas_si_customer_runtime_test LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT"
              )
              cur.execute(
                  "GRANT jas_si_customer_runtime TO jas_si_customer_runtime_test "
                  "WITH ADMIN FALSE, INHERIT FALSE, SET TRUE"
              )
              conn.commit()
              rate_bucket = bytes([11])*32
              with psycopg.connect(dsn) as customer_conn:
                  with customer_conn.cursor() as customer_cur:
                      customer_cur.execute("SET SESSION AUTHORIZATION jas_si_customer_runtime_test")
                      customer_cur.execute("SET ROLE jas_si_customer_runtime")
                      customer_cur.execute(
                          """SELECT allowed,retry_after_seconds
                               FROM public.jas_si_customer_rate_limit_check(%s,1,60)""",
                          (rate_bucket,),
                      )
                      first_rate = customer_cur.fetchone()
                      customer_cur.execute(
                          """SELECT allowed,retry_after_seconds
                               FROM public.jas_si_customer_rate_limit_check(%s,1,60)""",
                          (rate_bucket,),
                      )
                      second_rate = customer_cur.fetchone()
                      if first_rate is None or first_rate[0] is not True:
                          raise SystemExit(f"First customer rate-limit request was not allowed: {first_rate!r}")
                      if second_rate is None or second_rate[0] is not False:
                          raise SystemExit(f"Customer rate-limit threshold was not enforced: {second_rate!r}")
                      customer_cur.execute("SAVEPOINT direct_rate_limit_write_guard")
                      try:
                          customer_cur.execute(
                              """INSERT INTO public.jas_si_customer_rate_limits(
                                   bucket_key,window_started_at,request_count
                                 ) VALUES (%s,clock_timestamp(),1)""",
                              (bytes([12])*32,),
                          )
                      except psycopg.Error as exc:
                          if exc.sqlstate != "42501":
                              raise
                          customer_cur.execute("ROLLBACK TO SAVEPOINT direct_rate_limit_write_guard")
                      else:
                          raise SystemExit("Customer runtime retained direct rate-limit table INSERT")
                      customer_cur.execute("RELEASE SAVEPOINT direct_rate_limit_write_guard")
                      customer_cur.execute("RESET SESSION AUTHORIZATION")
              print("Verified database-owned customer rate limiting and denied direct table INSERT")
