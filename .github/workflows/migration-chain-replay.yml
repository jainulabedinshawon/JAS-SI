name: JAS-SI Clean Migration Chain Replay

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/jas_si_agent/migrations/**"
      - ".github/workflows/migration-chain-replay.yml"
      - "tests/test_customer_identity_postgres_integration.py"
  pull_request:
    branches:
      - main
      - feat/customer-identity-onboarding-v1
      - fix/tenant-suspension-locking-after-onboarding-fix
    paths:
      - "src/jas_si_agent/migrations/**"
      - ".github/workflows/migration-chain-replay.yml"
      - "tests/test_customer_identity_postgres_integration.py"

permissions:
  contents: read

concurrency:
  group: jas-si-migration-chain-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-postgres-replay:
    name: PostgreSQL 16 clean replay and idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jas_si_migration_replay
          POSTGRES_USER: cloud_admin
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloud_admin -d jas_si_migration_replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JAS_SI_MIGRATION_REPLAY_DATABASE_URL: postgresql://cloud_admin:test-only-password@localhost:5432/jas_si_migration_replay
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock.txt
      - name: Replay every migration twice on a clean database
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg

          root = Path.cwd()
          migration_dir = root / "src" / "jas_si_agent" / "migrations"
          migrations = (
              "001_create_audit_tables.sql",
              "002_create_tenant_api_keys.sql",
              "003_atomic_api_key_provisioning.sql",
              "004_audit_event_id_identity.sql",
              "005_provisioner_tenant_row_lock.sql",
              "006_api_key_registry_role_grants.sql",
              "007_customer_api_key_self_service.sql",
              "20261110_customer_identity.sql",
              "20261112_customer_identity_routines.sql",
              "20261113_customer_api_key_routines.sql",
              "20261110_customer_rate_limits.sql",
              "20261110_usage_metering.sql",
              "20261110_usage_idempotency_fingerprint.sql",
              "20261111_usage_append_only_role_grants.sql",
              "20261114_customer_usage_read_routines.sql",
              "20261115_api_key_auth_boundary.sql",
          )
          # This reassertion depends on the auth boundary and must run before
          # later usage routines when the migration is present on a PR branch.
          optional_tenant_lock_migration = "20261115z_api_key_auth_tenant_lock_reassert.sql"
          if migration_dir.joinpath(optional_tenant_lock_migration).is_file():
              migrations = migrations + (optional_tenant_lock_migration,)

          migrations = migrations + (
              "20261116_api_key_bound_usage_routines.sql",
              "20261117_runtime_usage_routine_only.sql",
              "20261118_shared_api_rate_limits.sql",
          )
          # These security, tenant-boundary, and agent lifecycle migrations are
          # mandatory on main. Never silently skip a missing dependency.
          required_security_agent_migrations = (
              "20261119_general_runtime_customer_identity_acl.sql",
              "20261120_api_key_auth_runtime_tenant_acl.sql",
              "20261121_security_audit_writer_boundary.sql",
              "20261122_customer_rate_limit_owner_boundary.sql",
              "20261123_agent_task_scope_allowlist.sql",
              "20261123_agent_task_store.sql",
              "20261124_agent_task_worker_lifecycle.sql",
          )
          missing_security_agent_migrations = [
              name for name in required_security_agent_migrations
              if not migration_dir.joinpath(name).is_file()
          ]
          if missing_security_agent_migrations:
              raise SystemExit(
                  "Missing required security/agent migrations: "
                  + ", ".join(missing_security_agent_migrations)
              )
          migrations = migrations + required_security_agent_migrations

          # Agent Worker/Verifier runtime migrations are required in canonical
          # order. A missing migration must fail CI rather than silently skip
          # part of the lifecycle or evidence boundary.
          required_agent_runtime_migrations = (
              "20261125_agent_task_usage_scope.sql",
              "20261126_agent_task_nonretryable_failures.sql",
              "20261127_agent_task_evidence_finalization.sql",
              "20261128_agent_task_verifier_claims.sql",
              "20261129_agent_runtime_default_acl_boundary.sql",
              "20261130_customer_tenant_active_guard_reassert.sql",
              "20261201_github_installation_binding.sql",
              "20261130a_general_runtime_default_acl_boundary.sql",
              "20261201_agent_task_verifier_inconclusive_lifecycle.sql",
          )
          missing_agent_runtime_migrations = [
              name for name in required_agent_runtime_migrations
              if not migration_dir.joinpath(name).is_file()
          ]
          if missing_agent_runtime_migrations:
              raise SystemExit(
                  "Missing required Agent runtime migrations: "
                  + ", ".join(missing_agent_runtime_migrations)
              )
          migrations = migrations + required_agent_runtime_migrations

          dsn = os.environ["JAS_SI_MIGRATION_REPLAY_DATABASE_URL"]
          with psycopg.connect(dsn) as conn, conn.cursor() as cur:
              # These three core service roles are platform bootstrap inputs,
              # not customer migrations. Create them explicitly on the empty DB.
              for role in (
                  "jas_si_runtime", "jas_si_provisioner", "jas_si_customer_runtime",
                  "neondb_owner", "cloud_admin", "jas_si_agent_worker_login", "jas_si_agent_verifier_login",
              ):
                  cur.execute("SELECT 1 FROM pg_catalog.pg_roles WHERE rolname=%s", (role,))
                  if cur.fetchone() is None:
                      cur.execute(
                          f'CREATE ROLE "{role}" NOLOGIN NOSUPERUSER '
                          + ("CREATEDB CREATEROLE " if role in ("neondb_owner", "cloud_admin") else "NOCREATEDB NOCREATEROLE ")
                          + "NOREPLICATION NOBYPASSRLS NOINHERIT"
                      )

              # Match Neon: cloud_admin is the managed superuser grantor,
              # while neondb_owner owns the public schema and runs migrations.
              # RESET ROLE inside migrations must return to neondb_owner.
              cur.execute("ALTER ROLE cloud_admin LOGIN SUPERUSER CREATEDB CREATEROLE INHERIT BYPASSRLS")
              cur.execute("ALTER DATABASE jas_si_migration_replay OWNER TO neondb_owner")
              cur.execute("ALTER SCHEMA public OWNER TO neondb_owner")
              cur.execute("SET SESSION AUTHORIZATION cloud_admin")
              for managed_role in ("jas_si_customer_runtime", "jas_si_runtime", "jas_si_provisioner"):
                  cur.execute(
                      f'GRANT "{managed_role}" TO neondb_owner '
                      "WITH ADMIN TRUE, INHERIT FALSE, SET FALSE"
                  )
              cur.execute("RESET SESSION AUTHORIZATION")
              # Pre-create database-owned SECURITY DEFINER principals and
              # seed Neon's cloud_admin ADMIN grant before the migrations add
              # neondb_owner's separate SET-only membership.
              owner_roles = ["jas_si_customer_identity_owner","jas_si_customer_key_owner","jas_si_audit_writer_owner","jas_si_customer_rate_limit_owner"]
              for owner_role in owner_roles:
                  cur.execute("SELECT 1 FROM pg_catalog.pg_roles WHERE rolname=%s", (owner_role,))
                  if cur.fetchone() is None:
                      cur.execute(
                          f'CREATE ROLE "{owner_role}" NOLOGIN NOSUPERUSER NOCREATEDB '
                          "NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT"
                      )
              # Neon records cloud_admin as grantor without making it a
              # member of the protected NOLOGIN owner roles.
              cur.execute("SET SESSION AUTHORIZATION cloud_admin")
              for owner_role in owner_roles:
                  cur.execute(
                      f'GRANT "{owner_role}" TO neondb_owner '
                      "WITH ADMIN TRUE, INHERIT FALSE, SET FALSE"
                  )
              cur.execute("RESET SESSION AUTHORIZATION")
              cur.execute("SET SESSION AUTHORIZATION neondb_owner")
              # Emit membership provenance before fail-closed owner-role checks.
              cur.execute("""
                  SELECT granted.rolname, member.rolname, grantor.rolname,
                         m.admin_option, m.inherit_option, m.set_option
                    FROM pg_catalog.pg_auth_members m
                    JOIN pg_catalog.pg_roles granted ON granted.oid=m.roleid
                    JOIN pg_catalog.pg_roles member ON member.oid=m.member
                    JOIN pg_catalog.pg_roles grantor ON grantor.oid=m.grantor
                   WHERE granted.rolname='jas_si_customer_identity_owner'
                      OR member.rolname='jas_si_customer_identity_owner'
                   ORDER BY granted.rolname,member.rolname,grantor.rolname
              """)
              print("customer identity owner membership fixture:", cur.fetchall())

              for replay in (1, 2):
                  for name in migrations:
                      path = migration_dir / name
                      if not path.is_file():
                          raise SystemExit(f"Missing migration in canonical replay order: {name}")
                      cur.execute(path.read_text(encoding="utf-8"))
                  print(f"Migration pass {replay}: {len(migrations)} files applied")
              cur.execute("RESET SESSION AUTHORIZATION")

              # The customer email limiter must be isolated behind its dedicated
              # NOLOGIN owner routine after every clean replay. Catch drift before
              # any environment migration is considered safe to apply.
              cur.execute("""
                  SELECT
                    NOT EXISTS (
                      SELECT 1 FROM pg_catalog.pg_roles
                       WHERE rolname='jas_si_customer_rate_limit_owner'
                         AND NOT rolcanlogin AND NOT rolsuper AND NOT rolcreatedb
                         AND NOT rolcreaterole AND NOT rolreplication
                         AND NOT rolbypassrls AND NOT rolinherit
                    )
                    OR pg_catalog.pg_get_userbyid(
                         (SELECT relowner FROM pg_catalog.pg_class
                           WHERE oid='public.jas_si_customer_rate_limits'::regclass)
                       ) <> 'jas_si_customer_rate_limit_owner'
                    OR pg_catalog.pg_get_userbyid(
                         (SELECT proowner FROM pg_catalog.pg_proc
                           WHERE oid=pg_catalog.to_regprocedure(
                             'public.jas_si_customer_rate_limit_check(bytea,integer,integer)'))
                       ) <> 'jas_si_customer_rate_limit_owner'
                    OR NOT EXISTS (
                      SELECT 1 FROM pg_catalog.pg_proc p
                       WHERE p.oid=pg_catalog.to_regprocedure(
                         'public.jas_si_customer_rate_limit_check(bytea,integer,integer)')
                         AND p.prosecdef
                         AND 'search_path=pg_catalog'=ANY(
                           COALESCE(p.proconfig,ARRAY[]::text[]))
                    )
                    OR EXISTS (
                      SELECT 1
                        FROM (VALUES ('jas_si_customer_runtime'),
                                     ('jas_si_runtime'),
                                     ('jas_si_provisioner')) roles(role_name)
                        CROSS JOIN (VALUES ('SELECT'),('INSERT'),('UPDATE'),
                                           ('DELETE'),('TRUNCATE'),('REFERENCES'),
                                           ('TRIGGER')) privileges(privilege)
                       WHERE pg_catalog.has_table_privilege(
                         role_name,'public.jas_si_customer_rate_limits',privilege)
                    )
                    OR EXISTS (
                      SELECT 1
                        FROM (VALUES ('jas_si_customer_runtime'),
                                     ('jas_si_runtime'),
                                     ('jas_si_provisioner')) roles(role_name)
                        CROSS JOIN (VALUES ('SELECT'),('INSERT'),('UPDATE'),
                                           ('REFERENCES')) privileges(privilege)
                       WHERE pg_catalog.has_any_column_privilege(
                         role_name,'public.jas_si_customer_rate_limits',privilege)
                    )
                    OR EXISTS (
                      SELECT 1 FROM pg_catalog.aclexplode(
                        COALESCE(
                          (SELECT proacl FROM pg_catalog.pg_proc
                            WHERE oid=pg_catalog.to_regprocedure(
                              'public.jas_si_customer_rate_limit_check(bytea,integer,integer)')),
                          pg_catalog.acldefault('f',
                            (SELECT proowner FROM pg_catalog.pg_proc
                              WHERE oid=pg_catalog.to_regprocedure(
                                'public.jas_si_customer_rate_limit_check(bytea,integer,integer)')))
                        )
                      ) acl
                      WHERE acl.grantee=0 AND acl.privilege_type='EXECUTE'
                    )
              """)
              if cur.fetchone()[0]:
                  raise SystemExit(
                      "Customer rate-limit owner/routine boundary is not least-privilege"
                  )

              # Simulate dedicated login-to-capability SET ROLE memberships in
              # this disposable CI database; no credentials are provisioned.
              cur.execute(
                  "GRANT jas_si_agent_worker TO jas_si_agent_worker_login "
                  "WITH ADMIN FALSE, INHERIT FALSE, SET TRUE"
              )
              cur.execute(
                  "GRANT jas_si_agent_verifier TO jas_si_agent_verifier_login "
                  "WITH ADMIN FALSE, INHERIT FALSE, SET TRUE"
              )

              cur.execute("""
                  SELECT
                    pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','SELECT')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','INSERT')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','UPDATE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','DELETE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_usage_events','TRUNCATE')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_usage_events','SELECT')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_usage_events','INSERT')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_usage_events','UPDATE')
              """)
              if cur.fetchone()[0]:
                  raise SystemExit("jas_si_runtime regained direct usage-event table/column access")

              cur.execute("""
                  SELECT
                    pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','SELECT')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','INSERT')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','UPDATE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','DELETE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','TRUNCATE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','REFERENCES')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_tenants','TRIGGER')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_tenants','SELECT')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_tenants','INSERT')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_tenants','UPDATE')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_tenants','REFERENCES')
              """)
              if cur.fetchone()[0]:
                  raise SystemExit("jas_si_runtime regained direct tenant-table/column access")

              cur.execute("""
                  SELECT EXISTS (
                    SELECT 1
                      FROM (VALUES ('jas_si_runtime'),('jas_si_provisioner')) roles(role_name)
                      CROSS JOIN (VALUES ('INSERT'),('UPDATE'),('DELETE'),('TRUNCATE')) privileges(privilege)
                     WHERE pg_catalog.has_table_privilege(role_name,'public.jas_si_audit_chain_state',privilege)
                  ) OR EXISTS (
                    SELECT 1
                      FROM (VALUES ('jas_si_runtime'),('jas_si_provisioner')) roles(role_name)
                      CROSS JOIN (VALUES ('INSERT'),('UPDATE')) privileges(privilege)
                     WHERE pg_catalog.has_any_column_privilege(role_name,'public.jas_si_audit_chain_state',privilege)
                  ) OR EXISTS (
                    SELECT 1
                      FROM (VALUES ('jas_si_runtime'),('jas_si_provisioner')) roles(role_name)
                     WHERE pg_catalog.has_table_privilege(role_name,'public.jas_si_audit_events','INSERT')
                        OR pg_catalog.has_table_privilege(role_name,'public.jas_si_audit_events','UPDATE')
                        OR pg_catalog.has_table_privilege(role_name,'public.jas_si_audit_events','DELETE')
                        OR pg_catalog.has_table_privilege(role_name,'public.jas_si_audit_events','TRUNCATE')
                        OR pg_catalog.has_any_column_privilege(role_name,'public.jas_si_audit_events','INSERT')
                        OR pg_catalog.has_any_column_privilege(role_name,'public.jas_si_audit_events','UPDATE')
                  )
              """)
              if cur.fetchone()[0]:
                  raise SystemExit("Runtime/provisioner regained direct audit table mutation privileges")

              cur.execute("""
                  SELECT
                    pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_agent_tasks','SELECT')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_agent_tasks','INSERT')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_agent_tasks','UPDATE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_agent_tasks','DELETE')
                    OR pg_catalog.has_table_privilege('jas_si_runtime','public.jas_si_agent_tasks','TRUNCATE')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_agent_tasks','SELECT')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_agent_tasks','INSERT')
                    OR pg_catalog.has_any_column_privilege('jas_si_runtime','public.jas_si_agent_tasks','UPDATE')
                    OR pg_catalog.has_table_privilege('jas_si_provisioner','public.jas_si_agent_tasks','SELECT')
                    OR pg_catalog.has_table_privilege('jas_si_provisioner','public.jas_si_agent_tasks','INSERT')
                    OR pg_catalog.has_table_privilege('jas_si_provisioner','public.jas_si_agent_tasks','UPDATE')
                    OR pg_catalog.has_table_privilege('jas_si_provisioner','public.jas_si_agent_tasks','DELETE')
              """)
              if cur.fetchone()[0]:
                  raise SystemExit("Runtime/provisioner regained direct agent-task table access")

              cur.execute("""
                  SELECT
                    NOT EXISTS (
                      SELECT 1 FROM pg_catalog.pg_roles
                       WHERE rolname='jas_si_agent_worker'
                         AND NOT rolcanlogin AND NOT rolsuper AND NOT rolcreatedb
                         AND NOT rolcreaterole AND NOT rolreplication
                         AND NOT rolbypassrls AND NOT rolinherit
                    )
                    OR pg_catalog.has_table_privilege(
                         'jas_si_agent_worker','public.jas_si_agent_tasks','SELECT')
                    OR pg_catalog.has_table_privilege(
                         'jas_si_agent_worker','public.jas_si_agent_tasks','INSERT')
                    OR pg_catalog.has_table_privilege(
                         'jas_si_agent_worker','public.jas_si_agent_tasks','UPDATE')
                    OR pg_catalog.has_table_privilege(
                         'jas_si_agent_worker','public.jas_si_agent_tasks','DELETE')
                    OR EXISTS (
                      SELECT 1 FROM pg_catalog.pg_auth_members m
                       WHERE m.member=(SELECT oid FROM pg_catalog.pg_roles
                                       WHERE rolname='jas_si_agent_worker')
                    )
                    OR EXISTS (
                      SELECT 1
                        FROM pg_catalog.pg_proc p
                        JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace
                        JOIN pg_catalog.pg_roles owner ON owner.oid=p.proowner
                       WHERE n.nspname='public'
                         AND p.proname IN ('jas_si_agent_task_claim',
                                           'jas_si_agent_task_renew',
                                           'jas_si_agent_task_ack_cancel',
                                           'jas_si_agent_task_report',
                                           'jas_si_agent_task_fail')
                         AND (
                           owner.rolname<>'jas_si_agent_task_owner'
                           OR NOT p.prosecdef
                           OR NOT ('search_path=pg_catalog'=ANY(COALESCE(p.proconfig,ARRAY[]::text[])))
                           OR NOT pg_catalog.has_function_privilege(
                                'jas_si_agent_worker',p.oid,'EXECUTE')
                           OR pg_catalog.has_function_privilege(
                                'jas_si_runtime',p.oid,'EXECUTE')
                           OR pg_catalog.has_function_privilege(
                                'jas_si_provisioner',p.oid,'EXECUTE')
                           OR EXISTS (
                             SELECT 1 FROM pg_catalog.aclexplode(
                               COALESCE(p.proacl,pg_catalog.acldefault('f',p.proowner))
                             ) acl
                             WHERE acl.grantee=0 AND acl.privilege_type='EXECUTE'
                           )
                         )
                    )
              """)
              if cur.fetchone()[0]:
                  raise SystemExit("Worker lifecycle role/routine boundary is not least-privilege")
              cur.execute("""
                  SELECT count(*)
                    FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace
                   WHERE n.nspname='public'
                     AND p.proname IN ('jas_si_agent_task_claim',
                                       'jas_si_agent_task_renew',
                                       'jas_si_agent_task_ack_cancel',
                                       'jas_si_agent_task_report',
                                       'jas_si_agent_task_fail')
              """)
              if cur.fetchone()[0] != 5:
                  raise SystemExit("Expected all five worker lifecycle routines")

              # Verifier identity is distinct from Worker and receives no direct
              # table access. Only verifier lifecycle/evidence routines execute.
              cur.execute("""
                  SELECT
                    NOT EXISTS (
                      SELECT 1 FROM pg_catalog.pg_roles
                       WHERE rolname='jas_si_agent_verifier'
                         AND NOT rolcanlogin AND NOT rolsuper AND NOT rolcreatedb
                         AND NOT rolcreaterole AND NOT rolreplication
                         AND NOT rolbypassrls AND NOT rolinherit
                    )
                    OR pg_catalog.has_table_privilege(
                         'jas_si_agent_verifier','public.jas_si_agent_tasks','SELECT')
                    OR pg_catalog.has_table_privilege(
                         'jas_si_agent_verifier','public.jas_si_agent_tasks','UPDATE')
                    OR pg_catalog.has_table_privilege(
                         'jas_si_agent_verifier','public.jas_si_agent_evidence_records','SELECT')
                    OR pg_catalog.has_table_privilege(
                         'jas_si_agent_verifier','public.jas_si_agent_evidence_records','INSERT')
                    OR pg_catalog.has_table_privilege(
                         'jas_si_agent_worker','public.jas_si_agent_evidence_records','SELECT')
                    OR pg_catalog.has_table_privilege(
                         'jas_si_agent_worker','public.jas_si_agent_evidence_records','INSERT')
                    OR NOT pg_catalog.has_function_privilege(
                         'jas_si_agent_verifier',
                         'public.jas_si_agent_task_verification_claim(integer,integer)','EXECUTE')
                    OR NOT pg_catalog.has_function_privilege(
                         'jas_si_agent_verifier',
                         'public.jas_si_agent_task_verification_release(uuid,uuid,uuid)','EXECUTE')
                    OR NOT pg_catalog.has_function_privilege(
                         'jas_si_agent_verifier',
                         'public.jas_si_agent_task_verification_record_inconclusive(uuid,uuid,uuid,text)','EXECUTE')
                    OR NOT pg_catalog.has_function_privilege(
                         'jas_si_agent_verifier',
                         'public.jas_si_agent_task_finalize_success(uuid,uuid,uuid,uuid,text,bytea,jsonb,timestamptz)','EXECUTE')
                    OR pg_catalog.has_function_privilege(
                         'jas_si_agent_worker',
                         'public.jas_si_agent_task_verification_claim(integer,integer)','EXECUTE')
                    OR pg_catalog.has_function_privilege(
                         'jas_si_agent_worker',
                         'public.jas_si_agent_task_finalize_success(uuid,uuid,uuid,uuid,text,bytea,jsonb,timestamptz)','EXECUTE')
                    OR NOT pg_catalog.pg_has_role(
                         'jas_si_agent_worker_login','jas_si_agent_worker','MEMBER')
                    OR NOT pg_catalog.pg_has_role(
                         'jas_si_agent_verifier_login','jas_si_agent_verifier','MEMBER')
                    OR pg_catalog.pg_has_role(
                         'jas_si_agent_worker_login','jas_si_agent_verifier','MEMBER')
                    OR pg_catalog.pg_has_role(
                         'jas_si_agent_verifier_login','jas_si_agent_worker','MEMBER')
                    OR pg_catalog.has_table_privilege(
                         'jas_si_agent_worker_login','public.jas_si_agent_tasks','SELECT')
                    OR pg_catalog.has_table_privilege(
                         'jas_si_agent_verifier_login','public.jas_si_agent_evidence_records','SELECT')
                    OR NOT EXISTS (
                      SELECT 1 FROM pg_catalog.pg_class c
                      JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
                      WHERE n.nspname='public' AND c.relname='jas_si_agent_evidence_records'
                        AND c.relrowsecurity AND c.relforcerowsecurity
                    )
              """)
              if cur.fetchone()[0]:
                  raise SystemExit("Verifier/Worker identity or evidence boundary is not least-privilege")

              cur.execute("""
                  SELECT count(*),COALESCE(pg_catalog.bool_and(status IN (
                    'queued','running','cancel_requested','awaiting_verification',
                    'human_review_required','succeeded','failed','cancelled'
                  )),true)
                    FROM public.jas_si_agent_tasks
              """)
              task_rows, task_statuses_valid = cur.fetchone()
              if task_rows is None or not task_statuses_valid:
                  raise SystemExit("Task lifecycle status contract is invalid")

              cur.execute("""
                  SELECT count(*),
                         pg_catalog.bool_and(p.prosecdef),
                         pg_catalog.bool_and(r.rolname='jas_si_agent_task_owner'),
                         pg_catalog.bool_and(NOT r.rolcanlogin AND NOT r.rolsuper
                           AND NOT r.rolcreatedb AND NOT r.rolcreaterole
                           AND NOT r.rolreplication AND NOT r.rolbypassrls
                           AND NOT r.rolinherit),
                         pg_catalog.bool_and('search_path=pg_catalog'=ANY(p.proconfig)),
                         pg_catalog.bool_and(NOT EXISTS (
                           SELECT 1 FROM pg_catalog.aclexplode(
                             COALESCE(p.proacl,pg_catalog.acldefault('f',p.proowner))
                           ) acl WHERE acl.grantee=0 AND acl.privilege_type='EXECUTE'
                         ))
                    FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace
                    JOIN pg_catalog.pg_roles r ON r.oid=p.proowner
                   WHERE n.nspname='public'
                     AND p.proname IN ('jas_si_agent_task_create',
                                       'jas_si_agent_task_get',
                                       'jas_si_agent_task_cancel')
              """)
              task_count, task_secdef, task_owner, task_safe, task_path, task_no_public = cur.fetchone()
              if task_count != 3 or not all((task_secdef,task_owner,task_safe,task_path,task_no_public)):
                  raise SystemExit(
                    "Agent task routine security assertion failed: "
                    f"count={task_count}, security_definer={task_secdef}, "
                    f"owner={task_owner}, safe_owner={task_safe}, "
                    f"fixed_path={task_path}, no_public_execute={task_no_public}"
                  )

              cur.execute("""
                  SELECT count(*),
                         pg_catalog.bool_and(p.prosecdef),
                         pg_catalog.bool_and(NOT r.rolcanlogin AND NOT r.rolsuper
                           AND NOT r.rolcreatedb AND NOT r.rolcreaterole
                           AND NOT r.rolreplication AND NOT r.rolbypassrls
                           AND NOT r.rolinherit),
                         pg_catalog.bool_and('search_path=pg_catalog'=ANY(p.proconfig)),
                         pg_catalog.bool_and(NOT EXISTS (
                           SELECT 1
                             FROM pg_catalog.aclexplode(
                               COALESCE(p.proacl, pg_catalog.acldefault('f',p.proowner))
                             ) acl
                            WHERE acl.grantee=0 AND acl.privilege_type='EXECUTE'
                         ))
                    FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace
                    JOIN pg_catalog.pg_roles r ON r.oid=p.proowner
                   WHERE n.nspname='public'
                     AND (p.proname LIKE 'customer_%'
                       OR p.proname LIKE 'jas_si_api_key_%'
                       OR p.proname='jas_si_api_rate_limit_check')
              """)
              count, secure_definer, safe_owner, fixed_path, no_public = cur.fetchone()
              if not count or not all((secure_definer, safe_owner, fixed_path, no_public)):
                  raise SystemExit(
                      "Customer/API-key/usage routine security assertion failed: "
                      f"count={count}, security_definer={secure_definer}, "
                      f"safe_owner={safe_owner}, fixed_path={fixed_path}, "
                      f"no_public_execute={no_public}"
                  )
              print(f"Verified {count} SECURITY DEFINER routines and runtime usage-table isolation")
              from uuid import uuid4
              # Exercise tenant-scoped GitHub installation resolution with real
              # PostgreSQL roles, RLS, and separate tenant/repository fixtures.
              tenant_a, tenant_b = uuid4(), uuid4()
              installation_a, installation_b = 918349938, 918349939
              repository_a = "jas-si-test/tenant-a"
              repository_b = "jas-si-test/tenant-b"
              cur.execute(
                  "INSERT INTO public.jas_si_tenants(tenant_id,tenant_name) VALUES (%s,%s),(%s,%s)",
                  (tenant_a, f"github-binding-a-{tenant_a.hex}",
                   tenant_b, f"github-binding-b-{tenant_b.hex}"),
              )
              cur.execute("SET ROLE jas_si_agent_task_owner")
              cur.execute(
                  """INSERT INTO public.jas_si_github_app_installations(
                       installation_id,tenant_id,account_login,status,verified_at
                     ) VALUES
                       (%s,%s,'jas-si-test','active',clock_timestamp()),
                       (%s,%s,'jas-si-test','active',clock_timestamp())""",
                  (installation_a,tenant_a,installation_b,tenant_b),
              )
              cur.execute(
                  """INSERT INTO public.jas_si_github_app_installation_repositories(
                       installation_id,tenant_id,repository_full_name,status,verified_at
                     ) VALUES
                       (%s,%s,%s,'active',clock_timestamp()),
                       (%s,%s,%s,'active',clock_timestamp())""",
                  (installation_a,tenant_a,repository_a,
                   installation_b,tenant_b,repository_b),
              )
              cur.execute("RESET ROLE")
              for login_role, capability_role in (
                  ("jas_si_agent_worker_login","jas_si_agent_worker"),
                  ("jas_si_agent_verifier_login","jas_si_agent_verifier"),
              ):
                  with psycopg.connect(dsn) as host_conn:
                      with host_conn.cursor() as host_cur:
                          host_cur.execute(f"SET SESSION AUTHORIZATION {login_role}")
                          host_cur.execute(f"SET ROLE {capability_role}")
                          host_cur.execute(
                              """SELECT tenant_id,installation_id,repository_full_name
                                   FROM public.jas_si_github_installation_binding_resolve(%s,%s)""",
                              (tenant_a,repository_a),
                          )
                          own_binding = host_cur.fetchone()
                          if own_binding != (tenant_a,installation_a,repository_a):
                              raise SystemExit(
                                  f"{capability_role} could not resolve its tenant's active repository: {own_binding!r}"
                              )
                          host_cur.execute(
                              """SELECT tenant_id,installation_id,repository_full_name
                                   FROM public.jas_si_github_installation_binding_resolve(%s,%s)""",
                              (tenant_a,repository_b),
                          )
                          cross_tenant = host_cur.fetchone()
                          if cross_tenant is not None:
                              raise SystemExit(
                                  f"{capability_role} resolved another tenant's repository: {cross_tenant!r}"
                              )
                          host_cur.execute("SAVEPOINT direct_binding_read_guard")
                          try:
                              host_cur.execute(
                                  "SELECT installation_id FROM public.jas_si_github_app_installations"
                              )
                          except psycopg.Error as exc:
                              if exc.sqlstate != "42501":
                                  raise
                              host_cur.execute("ROLLBACK TO SAVEPOINT direct_binding_read_guard")
                          else:
                              raise SystemExit(
                                  f"{capability_role} retained direct installation-table SELECT"
                              )
                          host_cur.execute("RELEASE SAVEPOINT direct_binding_read_guard")
                          host_cur.execute("SAVEPOINT direct_tenant_read_guard")
                          try:
                              host_cur.execute("SELECT tenant_id FROM public.jas_si_tenants")
                          except psycopg.Error as exc:
                              if exc.sqlstate != "42501":
                                  raise
                              host_cur.execute("ROLLBACK TO SAVEPOINT direct_tenant_read_guard")
                          else:
                              raise SystemExit(
                                  f"{capability_role} retained direct tenant-table SELECT"
                              )
                          host_cur.execute("RELEASE SAVEPOINT direct_tenant_read_guard")
                          host_cur.execute("RESET SESSION AUTHORIZATION")
              print(
                  "Verified Worker and Verifier tenant binding: own repository resolves, "
                  "cross-tenant repository does not, and direct table reads are denied"
              )

