name: JAS-SI Post-Merge Security Verification

on:
  workflow_dispatch:

  push:
    paths:
      - "src/jas_si_agent/**"
      - "tests/**"
      - "requirements.lock.txt"
      - ".github/workflows/post-merge-security-verification.yml"

  pull_request:
    branches:
      - main
    paths:
      - "src/jas_si_agent/**"
      - "tests/**"
      - "requirements.lock.txt"
      - ".github/workflows/post-merge-security-verification.yml"

permissions:
  contents: read

concurrency:
  group: jas-si-post-merge-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-verification:
    name: Security Verification (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""

      - name: Install hash-verified locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --require-hashes \
            -r requirements.lock.txt

      - name: Record verification context
        run: |
          {
            echo "JAS-SI Post-Merge Security Verification"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Python:"
            python --version
            echo "UTC timestamp:"
            date -u +"%Y-%m-%dT%H:%M:%SZ"
          } | tee security-verification-report.txt

      - name: Compile source and tests
        run: |
          python -m compileall -q src/jas_si_agent tests

      - name: Run complete discovered unit-test suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v 2>&1 | tee -a security-verification-report.txt

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jas-si-security-verification-report
          path: security-verification-report.txt
          if-no-files-found: ignore
          retention-days: 90
