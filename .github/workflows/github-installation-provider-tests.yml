name: JAS-SI PostgreSQL GitHub Installation Provider Tests

on:
  push:
    branches:
      - feat/postgres-tenant-github-installation-provider-v1
    paths:
      - "src/jas_si_agent/github_installation_provider.py"
      - "src/jas_si_agent/github_installations.py"
      - "src/jas_si_agent/github_app_tokens.py"
      - "tests/test_github_installation_provider.py"
      - "tests/test_github_installations.py"
      - "tests/test_github_app_tokens.py"
      - "requirements.txt"
      - ".github/workflows/github-installation-provider-tests.yml"
  pull_request:
    paths:
      - "src/jas_si_agent/github_installation_provider.py"
      - "src/jas_si_agent/github_installations.py"
      - "src/jas_si_agent/github_app_tokens.py"
      - "tests/test_github_installation_provider.py"
      - "tests/test_github_installations.py"
      - "tests/test_github_app_tokens.py"
      - "requirements.txt"
      - ".github/workflows/github-installation-provider-tests.yml"

permissions:
  contents: read

concurrency:
  group: github-installation-provider-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-security-tests:
    name: PostgreSQL installation provider tests (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked runtime dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run installation provider and token issuer security tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover --start-directory tests --pattern "test_github_installation_provider.py" --verbose
          python -m unittest discover --start-directory tests --pattern "test_github_installations.py" --verbose
          python -m unittest discover --start-directory tests --pattern "test_github_app_tokens.py" --verbose
