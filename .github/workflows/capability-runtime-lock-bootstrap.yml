name: JAS-SI Capability Runtime Lock Bootstrap

on:
  push:
    branches:
      - "integrate/github-capability-broker-db-adapter-main-20261127"
    paths:
      - "requirements.in"
      - "requirements-capability.in"
      - ".github/workflows/capability-runtime-lock-bootstrap.yml"
  pull_request:
    branches:
      - main
    paths:
      - "requirements.in"
      - "requirements-capability.in"
      - ".github/workflows/capability-runtime-lock-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: jas-si-capability-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-capability-lock:
    name: Generate hash-locked capability runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""

      - name: Install pinned lock generator
        run: |
          python -m pip install --upgrade "pip==26.3"
          python -m pip install "pip-tools==7.7.0"

      - name: Generate complete hash-locked capability runtime
        run: |
          pip-compile \
            --resolver=backtracking \
            --generate-hashes \
            --output-file=requirements-capability.lock.txt \
            requirements-capability.in

      - name: Verify locked dependency installation
        run: |
          python -m pip install \
            --require-hashes \
            -r requirements-capability.lock.txt

      - name: Upload generated capability lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jas-si-capability-runtime-lock
          path: requirements-capability.lock.txt
          if-no-files-found: error
          retention-days: 7
