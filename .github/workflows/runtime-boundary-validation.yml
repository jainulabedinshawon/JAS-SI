name: JAS-SI Runtime Database Boundary Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/jas_si_agent/api.py"
      - "src/jas_si_agent/api_key_registry.py"
      - "src/jas_si_agent/customer_rate_limit.py"
      - "src/jas_si_agent/postgres_security_event_store.py"
      - "tests/test_api_key_registry.py"
      - "tests/test_customer_rate_limit.py"
      - "tests/test_postgres_security_event_store.py"
      - "src/jas_si_agent/agent_task_*.py"
      - "src/jas_si_agent/migrations/*agent_task*.sql"
      - "tests/test_agent_task_*.py"
      - ".github/workflows/runtime-boundary-validation.yml"

permissions:
  contents: read

concurrency:
  group: jas-si-runtime-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-boundary-tests:
    name: Python 3.10 runtime database boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install runtime dependencies and pinned test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . pytest==8.3.5
      - name: Run available runtime boundary tests
        env:
          PYTHONPATH: src
        run: |
          # This workflow spans Main's security-boundary tests and Agent Task
          # tests introduced by staged PRs. Run only paths present at this ref;
          # missing future-stage tests must not make unrelated PRs fail.
          candidates=(
            tests/test_postgres_security_event_store.py
            tests/test_customer_rate_limit.py
            tests/test_api_key_registry.py
            tests/test_agent_task_api.py
            tests/test_agent_task_verifier.py
            tests/test_agent_task_verifier_store.py
            tests/test_agent_task_verifier_supervisor.py
            tests/test_agent_task_worker.py
            tests/test_agent_task_worker_runtime.py
            tests/test_agent_task_worker_store.py
            tests/test_agent_task_worker_supervisor.py
          )
          tests=()
          for path in "${candidates[@]}"; do
            if [[ -f "$path" ]]; then
              tests+=("$path")
            else
              echo "SKIP (not present at this ref): $path"
            fi
          done
          if [[ "${#tests[@]}" -eq 0 ]]; then
            echo "No runtime-boundary test files found; failing closed."
            exit 1
          fi
          python -m pytest -q "${tests[@]}"
