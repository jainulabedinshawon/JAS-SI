name: JAS-SI API Key Registry Integration

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/jas_si_agent/postgres_security_event_store.py"
      - "tests/test_customer_identity_postgres_integration.py"
      - "src/jas_si_agent/customer_rate_limit.py"
      - "src/jas_si_agent/customer_identity.py"
      - "src/jas_si_agent/api_key_registry.py"
      - "src/jas_si_agent/api.py"
      - "src/jas_si_agent/config.py"
      - "tools/api_keys.py"
      - "tools/provision_key_encrypted.py"
      - "tools/staging_api_smoke_test.py"
      - "tools/revoke_staging_key_for_run.py"
      - ".github/workflows/protected-staging-api-key-provisioning.yml"
      - "tests/test_protected_provisioning_workflow_policy.py"
      - "docs/api/openapi-v1.yaml"
      - "src/jas_si_agent/migrations/**"
      - "tests/test_atomic_api_key_provisioning.py"
      - "tests/test_postgres_api_key_registry_integration.py"
      - "tests/test_postgres_security_event_store.py"
      - "tests/test_postgres_security_event_store_integration.py"
      - "tests/test_api_key_authentication.py"
      - "tests/test_api_startup.py"
      - "tests/test_rest_api.py"
      - "tests/test_verify_api.py"
      - "requirements.lock.txt"
      - ".github/workflows/api-key-registry-integration.yml"

  pull_request:
    branches:
      - main
    paths:
      - "src/jas_si_agent/postgres_security_event_store.py"
      - "tests/test_customer_identity_postgres_integration.py"
      - "src/jas_si_agent/customer_rate_limit.py"
      - "src/jas_si_agent/customer_identity.py"
      - "src/jas_si_agent/api_key_registry.py"
      - "src/jas_si_agent/migrations/**"
      - "tests/test_atomic_api_key_provisioning.py"
      - "tests/test_postgres_api_key_registry_integration.py"
      - "tests/test_postgres_security_event_store.py"
      - "tests/test_postgres_security_event_store_integration.py"
      - "requirements.lock.txt"
      - ".github/workflows/api-key-registry-integration.yml"
      - "tests/test_api_key_authentication.py"

permissions:
  contents: read

concurrency:
  group: jas-si-api-key-registry-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  openapi-contract:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Lint backend OpenAPI contract
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint docs/api/openapi-v1.yaml --ruleset .spectral.yaml

  postgres-integration:
    name: PostgreSQL 16 Integration Tests
    needs: openapi-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jas_si_test
          POSTGRES_USER: jas_si
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jas_si -d jas_si_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JAS_SI_TEST_DATABASE_URL: postgresql://jas_si:test-only-password@localhost:5432/jas_si_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock.txt

      - name: Compile PostgreSQL tests
        run: |
          python -m compileall -q src/jas_si_agent tests tools

      - name: Run PostgreSQL adapter tests
        run: |
          python -m unittest \
            tests.test_customer_identity_postgres_integration \
            tests.test_postgres_security_event_store \
            tests.test_postgres_security_event_store_integration \
            tests.test_postgres_api_key_registry_integration \
            tests.test_atomic_api_key_provisioning \
            tests.test_protected_provisioning_workflow_policy \
            tests.test_api_key_authentication \
            tests.test_api_key_registry \
            tests.test_api_startup \
            -v
