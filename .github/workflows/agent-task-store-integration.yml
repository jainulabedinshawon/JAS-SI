name: JAS-SI Agent Task Store Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "src/jas_si_agent/agent_task_store.py"
      - "src/jas_si_agent/migrations/**"
      - "tests/test_agent_task_store_postgres_integration.py"
      - "requirements.lock.txt"
      - ".github/workflows/agent-task-store-integration.yml"

permissions:
  contents: read

concurrency:
  group: jas-si-agent-task-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-agent-task-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jas_si_task_test
          POSTGRES_USER: jas_si
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jas_si -d jas_si_task_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JAS_SI_TEST_DATABASE_URL: postgresql://jas_si:test-only-password@localhost:5432/jas_si_task_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock.txt
      - name: Compile and test task store
        run: |
          python -m compileall -q src/jas_si_agent tests
          python -m unittest tests.test_agent_task_store_postgres_integration -v
