
name: JAS-SI Core Package Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "LICENSE"
      - "README.md"
      - "src/**"
      - ".github/workflows/core-package-validation.yml"

  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "LICENSE"
      - "README.md"
      - "src/**"
      - ".github/workflows/core-package-validation.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-package-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-isolated-install:
    name: Wheel Build and Isolated Install
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: ""

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.0" "setuptools>=77" wheel
          python -m build --wheel
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1

      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1

          required = {
              "jas_si_agent/__init__.py",
              "jas_si_agent/sdk.py",
              "jas_si_agent/authorization.py",
              "jas_si_agent/verification.py",
              "jas_si_agent/migrations/001_create_audit_tables.sql",
          }

          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              missing = required - names
              assert not missing, f"Missing files: {sorted(missing)}"

              metadata_path = next(
                  name for name in names
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = archive.read(metadata_path).decode()

              assert "Name: jas-si" in metadata
              assert "Version: 0.1.0" in metadata
              assert "Requires-Python: >=3.10" in metadata
              assert (
                  "License-Expression: LicenseRef-JAS-SI-Proprietary"
                  in metadata
              )

              license_files = [
                  name for name in names
                  if ".dist-info/licenses/" in name
                  and name.endswith("LICENSE")
              ]
              assert license_files, "LICENSE missing from wheel"

              print("Wheel contents: PASS")
              print("Package metadata: PASS")
              print("Proprietary license inclusion: PASS")
          PY

      - name: Install wheel in isolated environment
        run: |
          python -m venv /tmp/jas-si-wheel-venv
          /tmp/jas-si-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/jas-si-wheel-venv/bin/python -m pip install --no-deps dist/*.whl

      - name: Test isolated installation
        run: |
          /tmp/jas-si-wheel-venv/bin/python - <<'PY'
          from pathlib import Path
          import jas_si_agent
          from jas_si_agent import JASSI

          package_path = Path(jas_si_agent.__file__).resolve()

          assert "/tmp/jas-si-wheel-venv/" in str(package_path)

          client = JASSI()
          assert client is not None

          print("Installed package import: PASS")
          print("JASSI entry point: PASS")
          print(f"Package location: {package_path}")
          PY
